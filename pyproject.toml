[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f110x"
version = "0.1.0"
description = "Pure PyTorch reinforcement learning experiments for F1TENTH racing"
authors = [{ name = "F110_MARL contributors" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "pyglet",
    "pillow",
    "pyyaml",
    "numba",
    "pandas",
    "scipy",
    "tensorboard",
    "wandb",
    "rich"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
