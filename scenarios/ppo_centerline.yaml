includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/default.yaml
  - ../configs/training/on_policy.yaml
  - ../configs/wandb.yaml

experiment:
  name: ppo_centerline
  episodes: 5000
  seed: 42

environment:
  maps: [line2]
  max_steps: 3000
  action_repeat: 1
  centerline_autoload: true
  random_spawn:
    enabled: true
    allow_reuse: true

agents:
  car_0:
    algorithm: ppo
    role: racer
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/centerline_racing.yaml
    params:
      learning_rate: 0.0001
      hidden_dims: [64, 64]
      gamma: 0.998
      gae_lambda: 0.95
      ent_coef: 0.0
      n_steps: 2048
      batch_size: 256
    action_constraints:
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: false
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: algo_comparison
  job_type: ppo_centerline
  tags: [ppo, centerline]
  notes: "PPO single-agent centerline racing on line2"
  mode: online
