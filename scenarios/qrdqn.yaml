includes:
- ../configs/env/line2_gaplock.yaml
- ../configs/reward/gaplock_centerline_pressure.yaml
- ../configs/agents/ftg_defender.yaml
- ../configs/agents/action_constraints.yaml
- ../configs/evaluation/line2_gaplock_eval_standard.yaml
- ../configs/wandb.yaml
experiment:
  name: qrdqn
  episodes: 2000
  seed: 42
environment:
  max_steps: 1200
  action_repeat: 2
agents:
  car_0:
    role: attacker
    algorithm: sb3_qrdqn
    target_id: car_1
    params:
      # Same 25 discrete primitives as DQN for direct comparison
      action_set:
      - [0.0,  1.0]
      - [0.0,  0.7]
      - [0.0,  0.4]
      - [0.2,  1.0]
      - [0.2,  0.7]
      - [0.2,  0.4]
      - [-0.2, 1.0]
      - [-0.2, 0.7]
      - [-0.2, 0.4]
      - [0.4,  1.0]
      - [0.4,  0.7]
      - [0.4,  0.4]
      - [-0.4, 1.0]
      - [-0.4, 0.7]
      - [-0.4, 0.4]
      - [0.1,  1.0]
      - [0.1,  0.7]
      - [-0.1, 1.0]
      - [-0.1, 0.7]
      - [0.3,  1.0]
      - [0.3,  0.7]
      - [-0.3, 1.0]
      - [-0.3, 0.7]
      - [0.0,  0.15]
      - [0.0,  0.0]
      learning_rate: 0.0003
      gamma: 0.99
      tau: 0.005
      hidden_dims:
      - 256
      - 256
      buffer_size: 1000000
      batch_size: 256
      learning_starts: 1000
      train_freq: 4
      gradient_steps: 1
      exploration_fraction: 0.15
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05
    observation:
      preset: gaplock
wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: algo_comparison
  job_type: qrdqn
  tags:
  - comparison
  - qrdqn
  - gaplock
  notes: "QR-DQN vs PPO comparison — distributional discrete RL, same reward+env+budget (use run_sb3_offpolicy.py)"
  mode: online
