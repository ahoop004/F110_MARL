# MAPPO 2v2 racing baseline against fixed Hybrid PP+FTG opponents.
#
# car_0 and car_1 are trainable MAPPO teammates with shared actor and
# centralized critic. car_2 and car_3 are fixed non-ML racing opponents.
#
# This baseline uses the local-agent race_team_2v2 reward. Use
# race_team_2v2_completion for team progress shaping once comparing
# completion-focused 2v2 training runs.
#
# line2 is used first as a stable/simple map. max_steps=3000 is enough for
# initial 1-lap training while still allowing slow early MAPPO policies to
# time out cleanly.
includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/default.yaml
  - ../configs/training/mappo.yaml
  - ../configs/wandb.yaml

experiment:
  name: mappo_2v2_vs_hybrid_pp_ftg
  episodes: 5000
  seed: 42

environment:
  maps: [line2]
  target_laps: 1
  max_steps: 3000
  action_repeat: 2
  centerline_autoload: true
  centerline_features: true
  walls_autoload: true
  random_spawn:
    enabled: true
    allow_reuse: true
  vehicle_params:
    v_switch: 0.8
    a_max: 2.0
    v_min: -1.0
    v_max: 3.0

agents:
  # --- Trainable MAPPO teammates ---
  car_0:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_2
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/race_team_2v2.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  car_1:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_3
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/race_team_2v2.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  # --- Fixed non-ML opponents ---
  car_2:
    algorithm: hybrid_pp_ftg
    trainable: false
    role: opponent
    target_id: car_0
    params:
      lookahead: 1.5
      min_speed: 0.5
      max_speed: 3.0
      max_steer: 0.42
      wheelbase: 0.33020
      curvature_slowdown_threshold: 0.3
      speed_horizon: 3.0
      blend_distance: 3.0
      full_ftg_distance: 1.5
      ftg:
        max_distance: 10.0
        window_size: 4
        bubble_radius: 2.5
        max_steer: 0.42
        min_speed: 0.5
        max_speed: 3.0
        steering_gain: 0.30
        fov: 4.71238898
        normalized: false
        steer_smooth: 0.5
        mode: lidar
        gap_min_range: 0.5
        target_mode: center
        wall_avoid_kick: 0.02
        use_disparity_extender: true
        disparity_threshold: 0.35
        vehicle_width: 0.225
        safety_margin: 0.10

  car_3:
    algorithm: hybrid_pp_ftg
    trainable: false
    role: opponent
    target_id: car_1
    params:
      lookahead: 1.5
      min_speed: 0.5
      max_speed: 3.0
      max_steer: 0.42
      wheelbase: 0.33020
      curvature_slowdown_threshold: 0.3
      speed_horizon: 3.0
      blend_distance: 3.0
      full_ftg_distance: 1.5
      ftg:
        max_distance: 10.0
        window_size: 4
        bubble_radius: 2.5
        max_steer: 0.42
        min_speed: 0.5
        max_speed: 3.0
        steering_gain: 0.30
        fov: 4.71238898
        normalized: false
        steer_smooth: 0.5
        mode: lidar
        gap_min_range: 0.5
        target_mode: center
        wall_avoid_kick: 0.02
        use_disparity_extender: true
        disparity_threshold: 0.35
        vehicle_width: 0.225
        safety_margin: 0.10

wandb:
  enabled: false
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: racing_baselines
  job_type: mappo_2v2_vs_hybrid_pp_ftg
  tags: [mappo, racing, hybrid_pp_ftg, 2v2]
  notes: "MAPPO 2v2 racing against fixed Hybrid PP+FTG opponents on line2"
  mode: online
