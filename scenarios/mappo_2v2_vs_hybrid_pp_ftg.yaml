# MAPPO 2v2 racing baseline against fixed Hybrid PP+FTG opponents.
#
# car_0 and car_1 are trainable MAPPO teammates with shared actor and
# centralized critic. car_2 and car_3 are fixed non-ML racing opponents.
#
# Completion-focused three-lap race. Six maps are used for training and two
# held-out maps are reserved for evaluation; the split is explicit and stable.
includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/default.yaml
  - ../configs/training/mappo.yaml
  - ../configs/wandb.yaml

experiment:
  name: mappo_2v2_vs_hybrid_pp_ftg
  episodes: 5000
  seed: 42

mappo:
  reward_mode: individual
  critic_mode: agent_conditioned
  team_reward_reduction: mean

environment:
  map_bundles:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  map_bundles_train:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Spielberg_map
  map_bundles_eval:
    - Silverstone_map
    - Spa_map
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 3
  # Safety ceiling retained after the 2026-08-26 calibration. Successful
  # three-lap p95 was 64,121, but the fixed baseline did not finish every map;
  # see docs/RACE_DURATION_CALIBRATION.md before declaring a final limit.
  max_steps: 250000
  action_repeat: 2
  centerline_autoload: true
  centerline_features: true
  walls_autoload: true
  episode_termination:
    mode: all_agents
  terminal_agents:
    remain_collidable: true
    crashed_behavior: stationary
    finished_behavior: coast_then_stop
    finish_clearance_steps: 200
  random_spawn:
    enabled: true
    allow_reuse: true
  vehicle_params:
    v_switch: 0.8
    a_max: 2.0
    v_min: -1.0
    v_max: 3.0

agents:
  # --- Trainable MAPPO teammates ---
  car_0:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_2
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/race_team_2v2_completion.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: false
      speed_index: 1

  car_1:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_3
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/race_team_2v2_completion.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: false
      speed_index: 1

  # --- Fixed non-ML opponents ---
  car_2:
    algorithm: hybrid_pp_ftg
    trainable: false
    role: opponent
    target_id: car_0
    params:
      lookahead: 2.0
      min_speed: 0.8
      max_speed: 2.5
      max_steer: 0.35
      wheelbase: 0.33020
      curvature_slowdown_threshold: 0.2
      speed_horizon: 3.0
      blend_distance: 2.0
      full_ftg_distance: 0.75
      ftg:
        max_distance: 10.0
        window_size: 6
        bubble_radius: 2.5
        max_steer: 0.3
        min_speed: 0.8
        max_speed: 2.5
        steering_gain: 0.20
        fov: 4.71238898
        normalized: false
        steer_smooth: 0.7
        mode: lidar
        gap_min_range: 0.5
        target_mode: center
        wall_avoid_kick: 0.01
        use_disparity_extender: true
        disparity_threshold: 0.35
        vehicle_width: 0.225
        safety_margin: 0.10

  car_3:
    algorithm: hybrid_pp_ftg
    trainable: false
    role: opponent
    target_id: car_1
    params:
      lookahead: 2.0
      min_speed: 0.8
      max_speed: 2.5
      max_steer: 0.35
      wheelbase: 0.33020
      curvature_slowdown_threshold: 0.2
      speed_horizon: 3.0
      blend_distance: 2.0
      full_ftg_distance: 0.75
      ftg:
        max_distance: 10.0
        window_size: 6
        bubble_radius: 2.5
        max_steer: 0.3
        min_speed: 0.8
        max_speed: 2.5
        steering_gain: 0.20
        fov: 4.71238898
        normalized: false
        steer_smooth: 0.7
        mode: lidar
        gap_min_range: 0.5
        target_mode: center
        wall_avoid_kick: 0.01
        use_disparity_extender: true
        disparity_threshold: 0.35
        vehicle_width: 0.225
        safety_margin: 0.10

wandb:
  enabled: false
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: racing_baselines
  job_type: mappo_2v2_vs_hybrid_pp_ftg
  tags: [mappo, racing, hybrid_pp_ftg, 2v2]
  notes: "Three-lap MAPPO 2v2 race with independent lifecycle and collidable terminal vehicles"
  mode: online
