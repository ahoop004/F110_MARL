# Circle-only convergence experiment on the shared MF6.1 pretraining physics.
includes:
  - ppo_lap_completion_pretrain_combined_slip.yaml

experiment:
  name: ppo_combined_slip_circle_stable
  checkpoint: null
  total_steps: null
  episodes: 10000

environment:
  target_laps: 3
  max_steps: 16000
  episode_termination: {lap_completion: true}
  track_limits: {enabled: false}
  terminate_on_collision: true

evaluation:
  every_steps: null
  every_episodes: 100
  selection_strategy: completion_progress

agents:
  car_0:
    reward: ../configs/reward/tasks/lap_completion_circle_stable.yaml
    params:
      learning_rate: 0.0001
      learning_rate_end: 0.00003
      n_epochs: 4
      batch_size: 256
      n_steps: 2048
      # Pool independently bootstrapped episodes under one frozen policy.
      min_rollout_steps: 2048
      target_kl: 0.01
      # Approx. 20 s discount horizon and 5 s GAE trace at dt=0.05 s.
      gamma: 0.9975024987503127
      gae_lambda: 0.9925224662753052
      log_std_init: -0.5
      ent_coef: 0.001

wandb:
  group: ppo-combined-slip-circle-stable
  tags: [ppo, single-agent, circle, combined-slip, convergence-experiment]
  notes: "Circle ablation: pooled episode fragments, smaller PPO updates, longer credit horizon, lower time cost, bounded-policy entropy. Compare completion at matched decision budgets."
