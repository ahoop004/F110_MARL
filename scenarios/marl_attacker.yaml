# Phase 2: Train attacker policy across all MARL maps.
# Car count = number of agents defined here. IDs must be car_0..car_{N-1}.
# Current: 1 defender + 2 attackers = 3 cars.
# To add cars, append car_3, car_4, … in the agents block.
# MAPPO trainer pending; this scenario is kept as a MAPPO planning template.
includes:
  - ../configs/env/marl_6car.yaml

experiment:
  name: marl_attacker
  episodes: 20000
  seed: 42

environment:
  action_repeat: 2

agents:
  # --- Defenders (fixed opponents) ---
  car_0:
    role: defender
    algorithm: hybrid_pp_ftg
    params:
      lookahead: 1.5
      min_speed: 0.5
      max_speed: 3.0
      max_steer: 0.42
      blend_distance: 3.0
      full_ftg_distance: 1.5
      ftg:
        max_distance: 10.0
        window_size: 4
        bubble_radius: 2.5
        max_steer: 0.42
        min_speed: 0.5
        max_speed: 3.0
        steering_gain: 0.30
        fov: 4.71238898
        normalized: false
        steer_smooth: 0.5
        mode: lidar
        gap_min_range: 0.5
        target_mode: center
        wall_avoid_kick: 0.02
        use_disparity_extender: true
        disparity_threshold: 0.40
        vehicle_width: 0.225
        safety_margin: 0.10

  # --- Attackers (training role — shared PPO policy) ---
  car_1:
    role: attacker
    algorithm: ppo
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/attacker_racing.yaml
    params:
      learning_rate: 0.0001
      gamma: 0.998
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      batch_size: 256
      activation: tanh
      pi_hidden_dims: [64, 64]
      vf_hidden_dims: [128, 128]
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  car_2:
    role: attacker
    algorithm: ppo
    reward: ../configs/reward/attacker_racing.yaml
    observation: ../configs/observations/rl_racer.yaml
    params:
      learning_rate: 0.0001
      gamma: 0.998
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      batch_size: 256
      activation: tanh
      pi_hidden_dims: [64, 64]
      vf_hidden_dims: [128, 128]
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  # To add more attackers, append car_3, car_4 … here (copy car_2 block).

wandb:
  enabled: false
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: marl_multitracks
  job_type: attacker_ppo
  tags:
    - marl
    - multi-map
    - phase2
    - attacker
  notes: "Phase 2: train shared attacker policy vs hybrid PP+FTG defender"
  mode: online
