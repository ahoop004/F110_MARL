# Phase 2: Train attacker policy across all MARL maps.
# 3 attackers (car_3..5) share one PPO policy — focal agent cycles each episode.
# 3 defenders (car_0..2) run FTG as fixed opponents (replace with Phase 1 checkpoint when available).
# Map is randomized each episode; spawn points are drawn randomly from each map's annotations.
# Run with: python run_marl_roles.py --scenario scenarios/marl_attacker.yaml
includes:
  - ../configs/env/marl_6car.yaml
  - ../configs/reward/attacker_racing.yaml

experiment:
  name: marl_attacker
  episodes: 20000
  seed: 42

environment:
  action_repeat: 2

agents:
  # --- Defenders (fixed FTG opponents) ---
  car_0:
    role: defender
    algorithm: ftg
    params:
      max_distance: 10.0
      window_size: 4
      bubble_radius: 2.5
      max_steer: 0.42
      min_speed: 0.5
      max_speed: 3.0
      steering_gain: 0.30
      fov: 4.71238898
      normalized: false
      steer_smooth: 0.5
      mode: lidar
      gap_min_range: 0.5
      target_mode: center
      wall_avoid_kick: 0.02
      use_disparity_extender: true
      disparity_threshold: 0.40
      vehicle_width: 0.225
      safety_margin: 0.10

  car_1:
    role: defender
    algorithm: ftg
    params:
      max_distance: 10.0
      window_size: 4
      bubble_radius: 2.5
      max_steer: 0.42
      min_speed: 0.5
      max_speed: 3.0
      steering_gain: 0.30
      fov: 4.71238898
      normalized: false
      steer_smooth: 0.5
      mode: lidar
      gap_min_range: 0.5
      target_mode: center
      wall_avoid_kick: 0.02
      use_disparity_extender: true
      disparity_threshold: 0.40
      vehicle_width: 0.225
      safety_margin: 0.10

  car_2:
    role: defender
    algorithm: ftg
    params:
      max_distance: 10.0
      window_size: 4
      bubble_radius: 2.5
      max_steer: 0.42
      min_speed: 0.5
      max_speed: 3.0
      steering_gain: 0.30
      fov: 4.71238898
      normalized: false
      steer_smooth: 0.5
      mode: lidar
      gap_min_range: 0.5
      target_mode: center
      wall_avoid_kick: 0.02
      use_disparity_extender: true
      disparity_threshold: 0.40
      vehicle_width: 0.225
      safety_margin: 0.10

  # --- Attackers (training role) ---
  car_3:
    role: attacker
    algorithm: sb3_ppo
    observation:
      preset: centerline_racing
    params:
      learning_rate: 0.0001
      gamma: 0.998
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      batch_size: 256
      activation: tanh
      pi_hidden_dims: [64, 64]
      vf_hidden_dims: [128, 128]
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  car_4:
    role: attacker
    algorithm: sb3_ppo
    observation:
      preset: centerline_racing
    params:
      learning_rate: 0.0001
      gamma: 0.998
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      batch_size: 256
      activation: tanh
      pi_hidden_dims: [64, 64]
      vf_hidden_dims: [128, 128]
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  car_5:
    role: attacker
    algorithm: sb3_ppo
    observation:
      preset: centerline_racing
    params:
      learning_rate: 0.0001
      gamma: 0.998
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      batch_size: 256
      activation: tanh
      pi_hidden_dims: [64, 64]
      vf_hidden_dims: [128, 128]
    action_constraints:
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: marl_multitracks
  job_type: attacker_ppo
  tags:
    - marl
    - multi-map
    - phase2
    - attacker
  notes: "Phase 2: train shared attacker policy vs FTG defenders across all MARL maps"
  mode: online
