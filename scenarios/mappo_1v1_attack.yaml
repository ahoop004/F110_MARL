# Matched 1v1 attack experiment; all active settings are inline.
# Both arms transfer the PPO actor from outputs/pretrain/best_model2.pt.
# MAPPO is used with ONE learner in both arms; the centralized critic starts fresh.
# Preserve physics, the 158 driving inputs and action semantics from pretraining.
# Append five target-relative inputs, zero-initialized in the transferred actor.
# See docs/1v1_attack.md for limits, reward/selection semantics and run commands.
experiment:
  name: mappo_1v1_attack
  total_steps: 20000000
  seed: 42
  num_envs: 1
  torch_threads: 1
  worker_startup_batch_size: 16
  worker_startup_timeout_s: 600
  worker_response_timeout_s: 120
training_defaults:
  progress_unit: environment_steps
  n_steps: 2048
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  batch_size: 512
  learning_rate: 0.0003
  gamma: 0.99
  rollout_steps_per_env: 256
  team_return_mode: per_agent
  pretrained_actor_checkpoint: ../outputs/pretrain/best_model2.pt
  require_pretrained_actor: true
  pretrained_actor_observation_extension: target_frenet
  checkpoint_every_steps: 409600
environment:
  timestep: 0.05
  lidar_beams: 108
  lidar_range: 10.0
  render: false
  centerline_autoload: true
  walls_autoload: true
  track_preview:
    points: 20
    spacing: 0.3
  episode_termination:
    mode: all_trainable
    lap_completion: true
    lap_finish_agents: [car_0]  # Only the learner finishes; the MPC keeps driving.
  terminal_agents:
    remain_collidable: true
    crashed_behavior: stationary
    finished_behavior: coast_then_stop
    finish_clearance_steps: 200
  vehicle_params:
    model: combined_slip_st
    model_version: 2
    tire_model: mf61_planar
    tire_id: synthetic-mf61-planar-v2
    drivetrain: shared_speed_awd
    calibration:
      id: f1tenth-gym-chassis-mf61-v1
      status: uncalibrated
      source: 'Chassis, footprint and nominal mu from F1TENTH Gym defaults: https://github.com/f1tenth/f1tenth_gym/blob/4fdb9c7e6fb7c701290f4dc18377d07c1681724f/gym/f110_gym/envs/f110_env.py
        MF6.1 effective-axle tire coefficients remain synthetic, not hardware fitted.'
    m: 3.74
    I: 0.04712
    lf: 0.15875
    lr: 0.17145
    h: 0.074
    mu: 1.0489
    slip_speed_floor: 0.5
    max_integration_step: 0.001
    length: 0.58
    width: 0.31
    wheel_actuators:
      version: 1
      calibration:
        id: f1tenth-gym-steering-wheel-v1
        status: uncalibrated
        source: 'Steering angle/rate bounds from F1TENTH Gym defaults: https://github.com/f1tenth/f1tenth_gym/blob/4fdb9c7e6fb7c701290f4dc18377d07c1681724f/gym/f110_gym/envs/f110_env.py
          Radius, time constants and wheel speed/rate bounds remain provisional.'
      wheel_radius: 0.05
      steering_time_constant: 0.5
      wheel_speed_time_constant: 0.15
      steering_min: -0.4189
      steering_max: 0.4189
      steering_rate_min: -3.2
      steering_rate_max: 3.2
      wheel_speed_min: -400.0
      wheel_speed_max: 100.0
      wheel_rate_min: -10000.0
      wheel_rate_max: 10000.0
    front_tire:
      FNOMIN: 19.050265385
      PCX1: 1.65
      PDX1: 1.0
      PDX2: -0.08
      PEX1: 0.5
      PEX2: 0.0
      PEX3: 0.0
      PEX4: 0.0
      PKX1: 12.0
      PKX2: 0.0
      PKX3: 0.0
      PHX1: 0.0
      PHX2: 0.0
      PVX1: 0.0
      PVX2: 0.0
      PCY1: 1.3
      PDY1: 1.0
      PDY2: -0.08
      PEY1: -0.5
      PEY2: 0.0
      PEY3: 0.0
      PKY1: -10.0
      PKY2: 1.5
      PKY4: 2.0
      PHY1: 0.0
      PHY2: 0.0
      PVY1: 0.0
      PVY2: 0.0
      RBX1: 10.0
      RBX2: 0.0
      RCX1: 1.0
      REX1: 0.0
      REX2: 0.0
      RHX1: 0.0
      RBY1: 10.0
      RBY2: 0.0
      RBY3: 0.0
      RCY1: 1.0
      REY1: 0.0
      REY2: 0.0
      RHY1: 0.0
      RHY2: 0.0
      RVY1: 0.0
      RVY2: 0.0
      RVY4: 0.0
      RVY5: 0.0
      RVY6: 0.0
    rear_tire:
      FNOMIN: 17.639134615
      PCX1: 1.65
      PDX1: 1.0
      PDX2: -0.08
      PEX1: 0.5
      PEX2: 0.0
      PEX3: 0.0
      PEX4: 0.0
      PKX1: 12.0
      PKX2: 0.0
      PKX3: 0.0
      PHX1: 0.0
      PHX2: 0.0
      PVX1: 0.0
      PVX2: 0.0
      PCY1: 1.3
      PDY1: 1.0
      PDY2: -0.08
      PEY1: -0.5
      PEY2: 0.0
      PEY3: 0.0
      PKY1: -10.0
      PKY2: 1.5
      PKY4: 2.0
      PHY1: 0.0
      PHY2: 0.0
      PVY1: 0.0
      PVY2: 0.0
      RBX1: 10.0
      RBX2: 0.0
      RCX1: 1.0
      REX1: 0.0
      REX2: 0.0
      RHX1: 0.0
      RBY1: 10.0
      RBY2: 0.0
      RBY3: 0.0
      RCY1: 1.0
      REY1: 0.0
      REY2: 0.0
      RHY1: 0.0
      RHY2: 0.0
      RVY1: 0.0
      RVY2: 0.0
      RVY4: 0.0
      RVY5: 0.0
      RVY6: 0.0
  map_bundles:
  - Budapest_map
  - circle_map
  - Melbourne_map
  - Montreal_map
  - Shanghai_map
  - Silverstone_map
  - Spa_map
  - Spielberg_map
  map_bundles_train:
  - Budapest_map
  - circle_map
  - Melbourne_map
  - Montreal_map
  - Shanghai_map
  - Silverstone_map
  - Spa_map
  - Spielberg_map
  map_bundles_eval:
  - Budapest_map
  - circle_map
  - Melbourne_map
  - Montreal_map
  - Shanghai_map
  - Silverstone_map
  - Spa_map
  - Spielberg_map
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 5
  lap_counting:
    require_finish_line: true
    count_initial_crossing_as_lap: false
  max_steps: 40000  # 2000 simulated seconds; allows five laps plus slow attack maneuvers.
  action_repeat: 1
  centerline_features: true
  centerline_render: true
  track_limits:
    enabled: true
    terminate: true
  terminate_on_collision: true
  random_spawn:
    enabled: true
    allow_reuse: true
  spawn:
    policy: centerline_relative
    centerline:
      mode: random
      min_progress: 0.0
      max_progress: 1.0
      avoid_finish: false
    offsets:
      s_offset: -3.0
      d_offset: 0.0
    ego:
      speed: 0.0
    target:
      enabled: true
      speed: 0.0
  friction:
    version: 1
    scope: shared
    train:
      mode: gaussian
      relative_std: 0.02
    eval:
      mode: fixed
      mu: 1.0489
  rendering:
    vehicle_colors:
      car_0: '#3288ff'
      car_1: '#ff2020'
  # Both boundary exits and wall collisions recover only the target.
  respawn:
    boundary_agents:
    - car_1
    collision_agents:
    - car_1
    collision_placement: random_ahead
    random_ahead:
      ego_id: car_0
      min_gap: 3.0
      max_gap: 10.0
      speed: 2.0
      clearance: 2.0
  # Proximity is an interaction proxy, not proof that ego caused a crash.
  attack_task:
    ego_id: car_0
    target_id: car_1
    interaction_distance: 3.0
    interaction_window_s: 1.0
    survival_s: 1.5
    survival_min_progress: 0.5  # Metres of net forward travel; still moving at confirmation.
evaluation:
  enabled: true
  every_steps: 409600
  # One selection episode per map; final testing uses two per map and new seeds.
  episodes: 8
  target_laps: 5
  max_steps: 40000
  seed: 10042
  selection_strategy: attack
  final_test:
    episodes: 16
    seed: 20042
  lap_completion: true
  terminate_on_track_limit: true
  terminate_on_collision: true
agents:
  car_0:
    algorithm: mappo
    trainable: true
    role: attacker
    observation:
      observation:
        lidar:
          enabled: true
          normalize: true
        frenet_vehicle_track:
          enabled: true
          points: 20
          wheel_radius: 0.05
          clip: false
          maxima:
            vx: 20.0
            vy: 20.0
            u: 3.141592653589793
            n: 5.0
            r: 10.0
            delta: 0.5
            delta_ref: 0.5
            omega_ref_dot: 100.0
            omega_ref: 400.0
            omega: 400.0
          wheel_speed_source: simulated_v1
          track_maxima:
            curvature: 1.0
            width: 1.0
        target_frenet:
          enabled: true
          maxima:
            delta_s: 30.0
            delta_d: 5.0
            delta_vs: 20.0
            delta_vd: 20.0
    reward:
      task:
        name: attack_1v1
        description: Safe alongside positioning and wall pressure with survival-qualified target crashes.
      reward:
        attack:
          enabled: true
          success_bonus: 10.0
          ego_crash_penalty: -20.0
          approach_weight: 0.5
          position_weight: 0.5
          edge_weight: 2.0
          safety_weight: 1.0  # Penalty per second for unsafe footprint clearance.
          safety_margin: 0.15  # Metres, for ego-to-wall and car-to-car clearance.
          shaping_gamma: 0.99  # Must match the learner's gamma below.
        progress_delta_bonus:
          enabled: true
          weight: 0.01
          units: metres
          positive_only: false
          boundary_penalty: 0.0
    params:
      learning_rate: 0.0001
      lr_schedule: constant
      learning_rate_end: 0.0001
      batch_size: 512
      pi_hidden_dims:
      - 256
      - 256
      vf_hidden_dims:
      - 512
      - 512
      activation: leaky_relu
      n_steps: 2048
      gamma: 0.99
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      vf_coef: 0.5
      max_grad_norm: 0.5
      log_std_init: 0.0
      target_kl: null
      checkpoint_every_steps: 409600
      device: cuda
    action_constraints:
      speed_control: wheel_acceleration
      max_wheel_acceleration: 100.0
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1
    target_id: car_1
  car_1:
    algorithm: racing_mpc
    trainable: false
    role: opponent
    target_id: car_0
    action_adapter: rolling_speed_to_wheel_v1
    params:
      max_speed: 4.5  # Initial catch-up curriculum; ego retains its pretrained 5 m/s ceiling.
      # Symmetric +/-5 m/s^2 rolling-speed reference rate; minimum speed is 0.
      # Ego uses +/-100 rad/s^2 with the same 0.05 m wheel radius.
      max_acceleration: 5.0
      horizon: 30
      knots: 6
      iterations: 18
      max_evaluations: 260
      margin: 0.1
      sensing_range: 10.0
      # Nonbinding: full steering span / 0.05 s = 16.756 rad/s.
      # Both cars retain the shared physical steering rate bound of +/-3.2 rad/s.
      max_steering_reference_rate: 17.0
wandb:
  logging:
    groups:
      define_metrics: true
      train: true
      eval: true
      eval_agg: true
      trainer_hooks: true
    # No metric allowlist: include attack outcomes, PPO losses and reward components.
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: mappo_1v1_attack
  group: 1v1-attack-matched
  job_type: attack-finetuning
  tags:
  - mappo
  - 1v1
  - attack
  - full-finetune
  - best-model2
  notes: One pretrained attacker against a fixed racing MPC with shared physics and a
    4.5 m/s target catch-up curriculum. Target respawns 3-10 m ahead; ego failure terminates.
  mode: online
mappo:
  actor_mode: shared
  reward_mode: individual
  critic_mode: agent_conditioned
  team_reward_reduction: mean
