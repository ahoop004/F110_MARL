includes:
- ../configs/env/line2_gaplock.yaml
- ../configs/reward/gaplock_centerline_pressure.yaml
- ../configs/agents/ftg_defender.yaml
- ../configs/agents/action_constraints.yaml
- ../configs/evaluation/line2_gaplock_eval_standard.yaml
- ../configs/wandb.yaml
experiment:
  name: a2c
  episodes: 2000
  seed: 42
environment:
  max_steps: 1200
  action_repeat: 2
agents:
  car_0:
    role: attacker
    algorithm: sb3_a2c
    target_id: car_1
    params:
      learning_rate: 0.0003
      gamma: 0.99
      n_steps: 600
      gae_lambda: 0.95
      ent_coef: 0.0
      vf_coef: 0.5
      activation: relu
      hidden_dims:
      - 256
      - 256
    observation:
      preset: gaplock
wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: a2c
  group: algo_comparison
  job_type: a2c
  tags:
  - comparison
  - a2c
  - gaplock
  notes: "A2C vs PPO comparison — same reward, env, budget (use run_sb3.py)"
  mode: online
