includes:
- ../configs/env/line2_gaplock.yaml
- ../configs/reward/gaplock_centerline_pressure.yaml
- ../configs/agents/ftg_defender.yaml
- ../configs/agents/action_constraints.yaml
- ../configs/curriculum/line2_gaplock_phased_full_stable85.yaml
- ../configs/wandb.yaml
experiment:
  name: ppo_curriculum_warm
  episodes: 2000
  seed: 42
environment:
  max_steps: 1200
  action_repeat: 2
evaluation:
  enabled: false
  frequency: 0
  gate_eval_schedule: false
  gate_phase_advancement: false
agents:
  car_0:
    role: attacker
    algorithm: sb3_ppo
    target_id: car_1
    params:
      # Set this to the saved file from pre-curriculum run, e.g.:
      # outputs/best_sb3/ppo/<run_id>_anneal85.zip
      warm_start_model_path: ""
      warm_start_reset_lr: true
      learning_rate: 0.0003
      learning_rate_schedule:
        type: linear
        final: 1.0e-05
      gamma: 0.99
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      clip_range_schedule:
        type: linear
        final: 0.05
      clip_range_vf: 0.2
      target_kl: 0.02
      max_grad_norm: 0.5
      vf_coef: 0.5
      normalize_advantage: true
      ent_coef: 0.0
      activation: relu
      hidden_dims:
      - 256
      - 256
      batch_size: 64
    observation:
      preset: gaplock
wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  tags:
  - ppo
  - curriculum
  - warm_start
