includes:
- ../configs/env/line2_gaplock.yaml
- ../configs/reward/gaplock_centerline_pressure.yaml
- ../configs/agents/ftg_defender.yaml
- ../configs/agents/action_constraints.yaml
- ../configs/evaluation/line2_gaplock_eval_standard.yaml
- ../configs/wandb.yaml
experiment:
  name: td3
  episodes: 2000
  seed: 42
environment:
  max_steps: 1200
  action_repeat: 2
agents:
  car_0:
    role: attacker
    algorithm: sb3_td3
    target_id: car_1
    params:
      learning_rate: 0.0001
      gamma: 0.99
      tau: 0.005
      action_noise_sigma: 0.2
      policy_delay: 2
      target_policy_noise: 0.2
      target_noise_clip: 0.5
      activation: relu
      hidden_dims:
      - 256
      - 256
      buffer_size: 1000000
      batch_size: 256
      learning_starts: 5000
      train_freq: 1
      gradient_steps: 1
    observation:
      preset: gaplock
wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: algo_comparison
  job_type: td3
  tags:
  - comparison
  - td3
  - gaplock
  notes: "TD3 vs PPO comparison — same reward, env, budget (use run_sb3_offpolicy.py)"
  mode: online
