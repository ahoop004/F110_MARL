  map_bundles:
  - Budapest_map
  - circle_map
  - Melbourne_map
  - Montreal_map
  - Shanghai_map
  - Silverstone_map
  - Spa_map
  - Spielberg_map
  map_bundles_train:
  - circle_map
  map_bundles_eval:
  - Budapest_map
  - circle_map
  - Melbourne_map
  - Montreal_map
  - Shanghai_map
  - Silverstone_map
  - Spa_map
  - Spielberg_map
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 1
  lap_counting:
    require_finish_line: true
    count_initial_crossing_as_lap: false
  max_steps: 200
  action_repeat: 1
  centerline_features: true
  centerline_render: true
  track_limits:
    enabled: true
    terminate: true
  terminate_on_collision: true
  friction:
    version: 1
    scope: shared
    train:
      mode: gaussian
      relative_std: 0.02
    eval:
      mode: fixed
      mu: 1.0489
  rendering:
    vehicle_colors:
      car_0: '#3288ff'
  skill_task:
    skill: recovery
    ego_id: car_0
    duration_s: 10.0
    confirmation_s: 1.0
    moving_speed: 1.0
    min_progress: 3.0
    lateral_tolerance: 0.2
    heading_tolerance: 0.15
evaluation:
  enabled: true
  num_workers: auto  # Shared pool across skill stages and solo retention.
  every_steps: 409600
  episodes: 80
  max_steps: 200
  seed: 10042
  selection_strategy: skill
  final_test:
    episodes: 160
    seed: 20042
  lap_completion: false
  terminate_on_track_limit: true
  terminate_on_collision: true
agents:
  car_0:
    algorithm: mappo
    trainable: true
    role: racer
    observation:
      observation:
        lidar:
          enabled: true
          normalize: true
        frenet_vehicle_track:
          enabled: true
          points: 20
          wheel_radius: 0.05
          clip: false
          maxima:
            vx: 20.0
            vy: 20.0
            u: 3.141592653589793
            n: 5.0
            r: 10.0
            delta: 0.5
            delta_ref: 0.5
            omega_ref_dot: 100.0
            omega_ref: 400.0
            omega: 400.0
          wheel_speed_source: simulated_v1
          track_maxima:
            curvature: 1.0
            width: 1.0
    reward:
      task:
        name: recovery
        description: Recover forward, aligned driving from disturbed starts.
      reward:
        skill:
          enabled: true
          progress_weight: 0.1
          success_bonus: 10.0
          ego_failure_penalty: -20.0
          lateral_weight: 1.0
          heading_weight: 1.0
    params:
      learning_rate: 0.0001
      lr_schedule: constant
      learning_rate_end: 0.0001
      batch_size: 512
      pi_hidden_dims:
      - 256
      - 256
      vf_hidden_dims:
      - 512
      - 512
      activation: leaky_relu
      n_steps: 2048
      gamma: 0.99
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      vf_coef: 0.5
      max_grad_norm: 0.5
      log_std_init: 0.0
      target_kl: null
      checkpoint_every_steps: 409600
      device: cuda
    action_constraints:
      speed_control: wheel_acceleration
      max_wheel_acceleration: 100.0
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1
wandb:
  logging:
    profile: auto
    groups:
      train: true
      eval: true
      performance: true
      curriculum: true
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: mappo_solo_recovery_lora
  group: skill-adapters
  job_type: recovery-lora
  tags:
  - mappo
  - solo
  - recovery
  - lora
  - skill-curriculum
  - best-model2
  notes: Independent frozen-base adapter; fixed all-stage evaluation and paired solo
    retention gating.
  mode: online
mappo:
  actor_mode: shared
  reward_mode: individual
  critic_mode: agent_conditioned
  team_reward_reduction: mean
skill_curriculum:
  success_threshold: 0.8
  max_ego_failure_rate: 0.1
  required_evaluations: 2
  retention:
    episodes_per_map: 5
    max_steps: 16000
    max_completion_drop: 0.05
    max_lap_time_increase: 0.1
  stages:
  - name: basic
    maps:
    - circle_map
    lateral_offset:
    - -0.2
    - 0.2
    initial_speed:
    - 0.0
    - 1.0
    evaluation_episodes_per_map: 20
    heading_error:
    - -0.35
    - 0.35
  - name: larger_disturbances
    maps:
    - circle_map
    lateral_offset:
    - -0.35
    - 0.35
    initial_speed:
    - 0.0
    - 2.0
    evaluation_episodes_per_map: 20
    heading_error:
    - -0.7
    - 0.7
  - name: generalization
    maps:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
    lateral_offset:
    - -0.5
    - 0.5
    initial_speed:
    - 0.0
    - 3.0
    evaluation_episodes_per_map: 5
    heading_error:
    - -1.1
    - 1.1
