# Integration experiment with uncalibrated reduced tires; train a fresh policy.
# This short horizon is for development, not lap-time or sim-to-real comparisons.
includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/combined_slip.yaml
  - ../configs/training/on_policy.yaml

experiment:
  name: ppo_combined_slip_development
  episodes: 10
  seed: 42
  num_envs: 1
  torch_threads: 1

environment:
  map_bundles: [circle_map]
  map_bundles_train: [circle_map]
  map_bundles_eval: [circle_map]
  max_steps: 500
  target_laps: 1
  lap_counting:
    count_initial_crossing_as_lap: false
  action_repeat: 2
  centerline_autoload: true
  centerline_features: true
  random_spawn:
    enabled: true
    allow_reuse: false

training_defaults:
  n_steps: 128
  n_epochs: 2
  batch_size: 64

agents:
  car_0:
    algorithm: ppo
    role: racer
    observation: ../configs/observations/rl_racer_simulated_wheel.yaml
    reward: ../configs/reward/tasks/lap_completion_frenet.yaml
    params:
      hidden_dims: [64, 64]
    action_constraints:
      speed_control: wheel_acceleration
      max_wheel_acceleration: 100.0  # rad/s² reference derivative
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: false
