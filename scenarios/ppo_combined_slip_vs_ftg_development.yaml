# FTG retains its m/s speed schedule; an explicit adapter commands wheel rad/s.
includes:
  - ppo_combined_slip_friction_development.yaml

experiment:
  name: ppo_combined_slip_vs_ftg_development

agents:
  car_1:
    algorithm: ftg
    role: defender
    trainable: false
    action_adapter: rolling_speed_to_wheel_v1
    observation: ../configs/observations/ftg.yaml
    params:
      min_speed: 0.5
      max_speed: 2.0
      max_steer: 0.4189
      normalized: false
