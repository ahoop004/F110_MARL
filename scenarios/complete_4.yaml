# Four-car cooperative MAPPO lap-completion scenario.
#
# All cars are trainable and use the shared MAPPO actor with local observations.
# The centralized critic consumes the joint global state. Each car terminates
# independently after completing its lap or crashing; the joint episode ends
# only after every car is terminal or the step limit is reached.
includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/default.yaml
  - ../configs/training/mappo.yaml
  - ../configs/wandb.yaml

experiment:
  name: complete_4
  episodes: 5000
  seed: 42

# Legacy scenario name retained for compatibility. New comparisons should use
# complete_4_individual.yaml and complete_4_team_shared.yaml explicitly.
mappo:
  reward_mode: individual
  critic_mode: agent_conditioned
  team_reward_reduction: mean
training_defaults:
  device: cuda

environment:
  map_bundles:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  map_bundles_train:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Spielberg_map
  map_bundles_eval:
    - Silverstone_map
    - Spa_map
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 1
  # Grid spawns are before the shared start/finish line. Treat that first
  # crossing as the start of the lap, not as a completed circuit.
  lap_counting:
    count_initial_crossing_as_lap: false
  # Shared provisional safety ceiling; successful three-lap p95 was 64,121,
  # but all-map controller completion remains a readiness gate. See
  # docs/RACE_DURATION_CALIBRATION.md.
  max_steps: 250000
  action_repeat: 2
  centerline_autoload: true
  centerline_features: true
  walls_autoload: true
  episode_termination:
    mode: all_agents
  random_spawn:
    enabled: true
    allow_reuse: true
  vehicle_params:
    v_switch: 0.8
    a_max: 2.0
    v_min: -20.0
    v_max: 20.0

agents:
  car_0:
    algorithm: mappo
    trainable: true
    role: racer
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/complete_4_lap_completion.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  car_1:
    algorithm: mappo
    trainable: true
    role: racer
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/complete_4_lap_completion.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  car_2:
    algorithm: mappo
    trainable: true
    role: racer
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/complete_4_lap_completion.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: true
      speed_index: 1

  car_3:
    algorithm: mappo
    trainable: true
    role: racer
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/complete_4_lap_completion.yaml
    params:
      learning_rate: 0.0003
      hidden_dims: [256, 256]
      gamma: 0.99
    action_constraints:
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: null
  group: complete4-full-circuit-v1
  job_type: train-individual
  tags: [mappo, racing, completion, 4car, full-circuit, individual-reward, agent-conditioned-critic]
  notes: "One-full-circuit four-racer MAPPO with individual rewards and an agent-conditioned critic"
  mode: online
