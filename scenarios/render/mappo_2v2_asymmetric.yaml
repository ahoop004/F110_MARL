# Playback of independent asymmetric progress/support policies.
# env -u PYGLET_HEADLESS python3 run.py --scenario scenarios/render/mappo_2v2_asymmetric.yaml --eval --checkpoint outputs/YOUR_RUN --allow-provenance-mismatch
# All active settings are inline. No scenario or config includes are required.
# Edit values below, or use --set key=value with the playback command above.
# Parameter overrides accept YAML scalars/lists/mappings; quote values containing spaces.
# A mapping replaces that subtree; key=!delete removes an optional setting.
# Dedicated flags (--seed, --num-envs, --episodes, etc.) take precedence over --set.
# Agent params override training_defaults. Keep physics, actions and observation layout
# matched to the checkpoint. The commented recipes at the end list coordinated choices.

# Run identity, execution budget and CPU/GPU collection layout.
experiment:
  # Run/output name; use a distinct name for each parameter comparison.
  name: render_mappo_2v2_asymmetric
  evaluation_only: true
  checkpoint: null
  # Episode budget. A non-null total_steps takes precedence; --episodes removes total_steps.
  episodes: 10
  # Reproducible seed. Keep final-test seeds disjoint from checkpoint-selection seeds.
  seed: 10042
  # 1 for serial/local collection; e.g. 400 for HPC. PPO n_steps must divide evenly across envs.
  num_envs: 1
  # PyTorch threads in the parent learner; collector processes use one thread.
  torch_threads: 1
  # Console reporting interval measured in policy updates.
  terminal_every_updates: 1
  # Seconds between collector heartbeat updates.
  collector_progress_interval_s: 15
  # Aggregate environment decisions, excluding evaluation; one joint race step counts once.

# Shared learner defaults. agents.<id>.params overrides these values.
training_defaults:
  # Provenance label for the collection/update protocol; change when the protocol changes.
  update_version: p7-packed-batch512-v1
  # Options used here: episodes or environment_steps; match the chosen run budget.
  progress_unit: environment_steps
  # PPO: pooled rollout transitions. MAPPO: per-agent serial buffer size.
  n_steps: 2048
  # Physics steps per policy decision; use 1 with joint team-return contracts.
  action_repeat: 1
  # Optimizer passes over each collected rollout.
  n_epochs: 10
  # Generalized-advantage bias/variance tradeoff, normally between 0 and 1.
  gae_lambda: 0.95
  # PPO probability-ratio clipping threshold.
  clip_range: 0.2
  # Exploration entropy coefficient; 0 disables the bonus.
  ent_coef: 0.01
  # Critic-loss multiplier.
  vf_coef: 0.5
  # Gradient norm clipping threshold.
  max_grad_norm: 0.5
  # Learner samples per optimizer minibatch.
  batch_size: 512
  # Initial optimizer learning rate.
  learning_rate: 0.0003
  # Reward discount per policy decision; changing action_repeat changes its physical time horizon.
  gamma: 0.99
  # Fallback hidden-layer widths shared by actor/critic unless pi_/vf_hidden_dims override them.
  hidden_dims:
    - 256
    - 256
  # Available network activations: tanh, relu, silu, swish, leaky_relu (see agents/common/networks.py).
  activation: tanh
  # joint for shared team returns; per_agent for separate learner returns. Match mappo reward/critic modes.
  team_return_mode: per_agent
  # PPO or shared-MAPPO checkpoint/run directory for actor initialization. --pretrained-actor overrides this.
  pretrained_actor_checkpoint: ../../outputs/asym/best_model.pt
  # Both comparison arms must start from a compatible PPO or plain shared-MAPPO policy.
  require_pretrained_actor: true
  # Observation extension contract for transfer; keep compatible with the inline observation layout.
  pretrained_actor_observation_extension: frenet_neighbors
  # Learner device: cpu, cuda, or an explicit device such as cuda:0.
  device: cpu
  # Checkpoint interval in aggregate environment decisions.
  checkpoint_every_steps: 4096000

# Choose reward aggregation and critic conditioning together.
mappo:
  # One complete actor per learner; one shared agent-conditioned critic.
  actor_mode: independent
  # Options: individual or team_shared.
  reward_mode: individual
  # Options: agent_conditioned for individual rewards, shared_team for team rewards.
  critic_mode: agent_conditioned
  # Options: mean or sum; this changes the reward scale.
  team_reward_reduction: mean

# Simulation, map selection, race lifecycle and sensing parameters.
environment:
  # Physics seconds per step; decision duration is timestep * action_repeat.
  timestep: 0.05
  # Number of LiDAR beams; affects policy input width when LiDAR is enabled.
  lidar_beams: 108
  # Maximum LiDAR range in metres.
  lidar_range: 10.0
  # true opens visualization; false is headless. --render/--no-render overrides this.
  render: true
  # Load centerline geometry from the selected map bundle.
  centerline_autoload: true
  # Load wall geometry from the selected map bundle.
  walls_autoload: true
  # Track lookahead geometry used by observations/controllers.
  track_preview:
    # Number of preview samples; changing this changes observation dimensions.
    points: 20
    # Distance in metres between track-preview samples.
    spacing: 0.3
  # Joint reset rule and whether a completed lap target ends a car's episode.
  episode_termination:
    # Options: any_agent, all_agents, all_trainable. Choose whether survivors keep driving.
    mode: all_agents
    # true enables lap finishing; false allows continuous driving.
    lap_completion: true
  # Behavior of cars after their terminal event; clearance affects collisions and sensing.
  terminal_agents:
    # Whether terminal cars remain physical obstacles before any configured removal.
    remain_collidable: true
    # Terminal crash behavior: stationary.
    crashed_behavior: stationary
    # Terminal finish behavior: coast_then_stop.
    finished_behavior: coast_then_stop
    # Physics steps allowed for finished-car clearance.
    finish_clearance_steps: 40
  # Physical model contract. Keep values matched for checkpoint transfer; synthetic values are uncalibrated.
  vehicle_params:
    # Options: legacy_st or combined_slip_st; the latter requires the complete MF6.1 and wheel-actuator blocks.
    model: combined_slip_st
    # Version of the physical state/action contract.
    model_version: 2
    tire_model: mf61_planar
    tire_id: synthetic-mf61-planar-v2
    drivetrain: shared_speed_awd
    # Parameter provenance; synthetic coefficients are not a calibrated vehicle model.
    calibration:
      id: f1tenth-gym-chassis-mf61-v1
      status: uncalibrated
      source: 'Chassis, footprint and nominal mu from F1TENTH Gym defaults: https://github.com/f1tenth/f1tenth_gym/blob/4fdb9c7e6fb7c701290f4dc18377d07c1681724f/gym/f110_gym/envs/f110_env.py
        MF6.1 effective-axle tire coefficients remain synthetic, not hardware fitted.'
    # Vehicle mass in kilograms.
    m: 3.74
    # Yaw inertia in kg m².
    I: 0.04712
    # Centre-of-mass to front axle distance in metres.
    lf: 0.15875
    # Centre-of-mass to rear axle distance in metres.
    lr: 0.17145
    # Centre-of-mass height in metres.
    h: 0.074
    # Road friction coefficient.
    mu: 1.0489
    # Speed floor in m/s used to regularize tire slip calculations.
    slip_speed_floor: 0.5
    # Maximum internal integration substep in seconds.
    max_integration_step: 0.001
    # Vehicle body length in metres.
    length: 0.58
    # Vehicle body width in metres.
    width: 0.31
    # Steering and wheel reference limits/dynamics; these define the nonlinear action contract.
    wheel_actuators:
      version: 1
      # Parameter provenance; synthetic coefficients are not a calibrated vehicle model.
      calibration:
        id: f1tenth-gym-steering-wheel-v1
        status: uncalibrated
        source: 'Steering angle/rate bounds from F1TENTH Gym defaults: https://github.com/f1tenth/f1tenth_gym/blob/4fdb9c7e6fb7c701290f4dc18377d07c1681724f/gym/f110_gym/envs/f110_env.py
          Radius, time constants and wheel speed/rate bounds remain provisional.'
      # Wheel radius in metres.
      wheel_radius: 0.05
      # First-order steering response time constant in seconds.
      steering_time_constant: 0.5
      # First-order wheel-speed response time constant in seconds.
      wheel_speed_time_constant: 0.15
      steering_min: -0.4189
      steering_max: 0.4189
      steering_rate_min: -3.2
      steering_rate_max: 3.2
      wheel_speed_min: -400.0
      wheel_speed_max: 400.0
      wheel_rate_min: -10000.0
      wheel_rate_max: 10000.0
    # Front-axle MF6.1 coefficients. Keep the full coefficient set; changing it changes physics.
    front_tire:
      # Nominal axle normal load in newtons.
      FNOMIN: 19.050265385
      PCX1: 1.65
      PDX1: 1.0
      PDX2: -0.08
      PEX1: 0.5
      PEX2: 0.0
      PEX3: 0.0
      PEX4: 0.0
      PKX1: 12.0
      PKX2: 0.0
      PKX3: 0.0
      PHX1: 0.0
      PHX2: 0.0
      PVX1: 0.0
      PVX2: 0.0
      PCY1: 1.3
      PDY1: 1.0
      PDY2: -0.08
      PEY1: -0.5
      PEY2: 0.0
      PEY3: 0.0
      PKY1: -10.0
      PKY2: 1.5
      PKY4: 2.0
      PHY1: 0.0
      PHY2: 0.0
      PVY1: 0.0
      PVY2: 0.0
      RBX1: 10.0
      RBX2: 0.0
      RCX1: 1.0
      REX1: 0.0
      REX2: 0.0
      RHX1: 0.0
      RBY1: 10.0
      RBY2: 0.0
      RBY3: 0.0
      RCY1: 1.0
      REY1: 0.0
      REY2: 0.0
      RHY1: 0.0
      RHY2: 0.0
      RVY1: 0.0
      RVY2: 0.0
      RVY4: 0.0
      RVY5: 0.0
      RVY6: 0.0
    # Rear-axle MF6.1 coefficients. Keep the full coefficient set; changing it changes physics.
    rear_tire:
      # Nominal axle normal load in newtons.
      FNOMIN: 17.639134615
      PCX1: 1.65
      PDX1: 1.0
      PDX2: -0.08
      PEX1: 0.5
      PEX2: 0.0
      PEX3: 0.0
      PEX4: 0.0
      PKX1: 12.0
      PKX2: 0.0
      PKX3: 0.0
      PHX1: 0.0
      PHX2: 0.0
      PVX1: 0.0
      PVX2: 0.0
      PCY1: 1.3
      PDY1: 1.0
      PDY2: -0.08
      PEY1: -0.5
      PEY2: 0.0
      PEY3: 0.0
      PKY1: -10.0
      PKY2: 1.5
      PKY4: 2.0
      PHY1: 0.0
      PHY2: 0.0
      PVY1: 0.0
      PVY2: 0.0
      RBX1: 10.0
      RBX2: 0.0
      RCX1: 1.0
      REX1: 0.0
      REX2: 0.0
      RHX1: 0.0
      RBY1: 10.0
      RBY2: 0.0
      RBY3: 0.0
      RCY1: 1.0
      REY1: 0.0
      REY2: 0.0
      RHY1: 0.0
      RHY2: 0.0
      RVY1: 0.0
      RVY2: 0.0
      RVY4: 0.0
      RVY5: 0.0
      RVY6: 0.0
  # Agent-to-team assignment used by observations, rewards and self-play.
  agent_teams:
    car_0: learners
    car_1: learners
    car_2: opponents
    car_3: opponents
  # Map switching schedule; per_episode changes the map when the environment resets.
  map_cycle: per_episode
  # Map selection: first, round_robin or random; epoch_shuffle reshuffles each completed cycle.
  map_pick: round_robin
  # Lap finish target; ignored as a termination trigger when lap_completion is false.
  target_laps: 3
  # Physics-step horizon; 0 disables the timeout. Evaluation should use a finite horizon.
  max_steps: 16000
  # Physics steps per policy decision; use 1 with joint team-return contracts.
  action_repeat: 1
  # Enable centerline progress/state facts required by observations and rewards.
  centerline_features: true
  # Episode start randomization; fixed starts use enabled: false and explicit spawn settings.
  random_spawn:
    # true enables this component; false disables it.
    enabled: true
    # Whether multiple spawn selections may reuse available slots.
    allow_reuse: true
  # Available map bundles under maps/. Choose matching training/evaluation lists below.
  map_bundles:
    - circle_map
    - Budapest_map
    - Hockenheim_map
    - L_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  # Training maps. Keep intended held-out maps out of this list.
  map_bundles_train:
    - circle_map
    - Budapest_map
    - Hockenheim_map
    - L_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  # Evaluation maps; disjointness is a protocol choice, not automatic.
  map_bundles_eval:
    - circle_map
    - Budapest_map
    - Hockenheim_map
    - L_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  # Finish-line crossing rules; do not change when comparing lap metrics.
  lap_counting:
    # false requires a full lap after the initial finish-line crossing.
    count_initial_crossing_as_lap: false
  # Episode friction protocol; train randomization and evaluation friction are configured separately.
  friction:
    version: 1
    scope: shared
    train:
      # Training: fixed, uniform, grid or gaussian. Evaluation: fixed or grid only; replace the whole phase mapping.
      mode: gaussian
      # Gaussian standard deviation as a fraction of nominal friction.
      relative_std: 0.02
    eval:
      # Training: fixed, uniform, grid or gaussian. Evaluation: fixed or grid only; replace the whole phase mapping.
      mode: fixed
      # Road friction coefficient.
      mu: 1.0489
  # true terminates a colliding car; false leaves collision sensing active without that terminal.
  terminate_on_collision: true
  # Geometric boundary detection and optional boundary termination.
  track_limits:
    # true enables this component; false disables it.
    enabled: true
    terminate: false

# Deterministic checkpoint-selection evaluation; final_test uses separate fixed seeds.
evaluation:
  # true enables this component; false disables it.
  enabled: true
  # Evaluation interval in completed training episodes.
  every_episodes: 100
  # Match the objective: lap_time, completion_progress, team_completion, team_combined, team_first_place, team_sweep, team_combined_penalties, map_curriculum, or two_team_completion.
  # First learner (car_0): completion, beating opponents, learner safety, time/progress.
  selection_strategy: asymmetric_support
  progress_agent_id: car_0
  # One selection episode per map in the round-robin cycle.
  episodes: 10
  # Reproducible seed. Keep final-test seeds disjoint from checkpoint-selection seeds.
  seed: 10042
  # Physics-step horizon; 0 disables the timeout. Evaluation should use a finite horizon.
  max_steps: 16000
  # Final evaluation after the policy/configuration is frozen; never use it for checkpoint selection.
  final_test:
    # Number of evaluation episodes for this protocol.
    episodes: 20
    # Reproducible seed. Keep final-test seeds disjoint from checkpoint-selection seeds.
    seed: 20042
  # Evaluation interval in aggregate training environment decisions.
  every_steps: 4096000
  episode_termination_mode: all_agents
  # Lap finish target; ignored as a termination trigger when lap_completion is false.
  target_laps: 3

# Per-car policy, inline observation/reward definitions and action processing.
agents:
  car_0:
    # Trainable: ppo/mappo. Fixed: ftg, pure_pursuit, stanley, hybrid_pp_ftg, racing_mpc or another registered MPC controller.
    algorithm: mappo
    # true creates a learner; false creates a fixed controller.
    trainable: true
    # racer, attacker, defender or opponent; attacker/defender roles may resolve target_id automatically.
    role: racer
    # Agent whose relative state/events this car tracks.
    target_id: car_2
    # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
    observation:
      # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
      observation:
        lidar:
          # true enables this component; false disables it.
          enabled: true
          # Normalize observation values using the configured scales.
          normalize: true
        frenet_vehicle_track:
          # true enables this component; false disables it.
          enabled: true
          # Number of preview samples; changing this changes observation dimensions.
          points: 20
          # Wheel radius in metres.
          wheel_radius: 0.05
          # Whether to clip normalized observation values to their configured range.
          clip: false
          # Normalization scales; keep them unchanged when transferring a trained actor.
          maxima:
            vx: 20.0
            vy: 20.0
            u: 3.141592653589793
            n: 5.0
            r: 10.0
            delta: 0.5
            delta_ref: 0.5
            omega_ref_dot: 100.0
            omega_ref: 400.0
            omega: 400.0
          # simulated_v1 reads actual simulated wheel speed; keep matched to the source actor.
          wheel_speed_source: simulated_v1
          # Fixed track scales used across maps; omitting them uses the component's per-map scaling.
          track_maxima:
            curvature: 1.0
            # Vehicle body width in metres.
            width: 1.0
        frenet_neighbors:
          # true enables this component; false disables it.
          enabled: true
          max_neighbors: 3
          include_team: true
          # Whether to clip normalized observation values to their configured range.
          clip: false
          agent_ids:
            - car_0
            - car_1
            - car_2
            - car_3
    # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
    reward:
      task:
        # Task identifier stored with the reward definition.
        name: lap_completion_pretraining
        description: Paper Eq. (3), signed distance progress or exclusive boundary penalty.
      # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
      reward:
        progress_delta_bonus:
          # true enables this component; false disables it.
          enabled: true
          weight: 1.0
          units: metres
          positive_only: false
          boundary_penalty: -1.0
    # Policy/controller parameters. Learner values here override training_defaults.
    params:
      # Initial optimizer learning rate.
      learning_rate: 0.0001
      # Actor hidden-layer widths; must match the source checkpoint when transferring.
      pi_hidden_dims:
        - 256
        - 256
      # Centralized/value-network hidden-layer widths.
      vf_hidden_dims:
        - 512
        - 512
      # Available network activations: tanh, relu, silu, swish, leaky_relu (see agents/common/networks.py).
      activation: leaky_relu
      # Reward discount per policy decision; changing action_repeat changes its physical time horizon.
      gamma: 0.99
      # Checkpoint interval in completed episodes.
      checkpoint_every: 100
    # Convert normalized learner actions into physical reference commands.
    action_constraints:
      # Options: direct, acceleration, wheel_speed, wheel_acceleration. Keep units matched to the vehicle model.
      speed_control: wheel_acceleration
      # Positive wheel-reference acceleration limit in rad/s².
      max_wheel_acceleration: 100.0
      # Wheel-reference deceleration magnitude in rad/s².
      max_wheel_deceleration: 100.0
      # true clamps reverse commands.
      prevent_reverse: true
      # Index of the speed/wheel-reference action, normally 1.
      speed_index: 1
  car_1:
    # Trainable: ppo/mappo. Fixed: ftg, pure_pursuit, stanley, hybrid_pp_ftg, racing_mpc or another registered MPC controller.
    algorithm: mappo
    # true creates a learner; false creates a fixed controller.
    trainable: true
    # racer, attacker, defender or opponent; attacker/defender roles may resolve target_id automatically.
    role: racer
    # Agent whose relative state/events this car tracks.
    target_id: car_3
    # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
    observation:
      # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
      observation:
        lidar:
          # true enables this component; false disables it.
          enabled: true
          # Normalize observation values using the configured scales.
          normalize: true
        frenet_vehicle_track:
          # true enables this component; false disables it.
          enabled: true
          # Number of preview samples; changing this changes observation dimensions.
          points: 20
          # Wheel radius in metres.
          wheel_radius: 0.05
          # Whether to clip normalized observation values to their configured range.
          clip: false
          # Normalization scales; keep them unchanged when transferring a trained actor.
          maxima:
            vx: 20.0
            vy: 20.0
            u: 3.141592653589793
            n: 5.0
            r: 10.0
            delta: 0.5
            delta_ref: 0.5
            omega_ref_dot: 100.0
            omega_ref: 400.0
            omega: 400.0
          # simulated_v1 reads actual simulated wheel speed; keep matched to the source actor.
          wheel_speed_source: simulated_v1
          # Fixed track scales used across maps; omitting them uses the component's per-map scaling.
          track_maxima:
            curvature: 1.0
            # Vehicle body width in metres.
            width: 1.0
        frenet_neighbors:
          # true enables this component; false disables it.
          enabled: true
          max_neighbors: 3
          include_team: true
          # Whether to clip normalized observation values to their configured range.
          clip: false
          agent_ids:
            - car_0
            - car_1
            - car_2
            - car_3
    # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
    reward:
      task:
        # Task identifier stored with the reward definition.
        name: progress_and_blocking_support
        description: Help car_0 progress, block active opponents, and earn a bonus for each opposing car crash.
      # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
      reward:
        progress_delta_bonus:
          # true enables this component; false disables it.
          enabled: true
          weight: 0.2
          units: metres
          positive_only: false
          boundary_penalty: -1.0
        team_support:
          enabled: true
          teammate_id: car_0
          progress_weight: 1.0
          blocking_weight: 1.0
          # Credit signed teammate/opponent progress difference only for active
          # opponents 0.6–6 m behind and within a 0.6 m lateral corridor.
          min_distance: 0.6
          max_distance: 6.0
          lateral_distance: 0.6
          max_step_progress: 1.0
        opponent_crash_bonus:
          enabled: true
          # +1 per opponent collision terminal, once per opponent per episode.
          # Includes mutual crashes; the self-collision penalty still applies.
          bonus: 1.0
        collision:
          enabled: true
          penalty: -5.0
    # Policy/controller parameters. Learner values here override training_defaults.
    params:
      # Initial optimizer learning rate.
      learning_rate: 0.0001
      # Actor hidden-layer widths; must match the source checkpoint when transferring.
      pi_hidden_dims:
        - 256
        - 256
      # Centralized/value-network hidden-layer widths.
      vf_hidden_dims:
        - 512
        - 512
      # Available network activations: tanh, relu, silu, swish, leaky_relu (see agents/common/networks.py).
      activation: leaky_relu
      # Reward discount per policy decision; changing action_repeat changes its physical time horizon.
      gamma: 0.99
      # Checkpoint interval in completed episodes.
      checkpoint_every: 100
    # Convert normalized learner actions into physical reference commands.
    action_constraints:
      # Options: direct, acceleration, wheel_speed, wheel_acceleration. Keep units matched to the vehicle model.
      speed_control: wheel_acceleration
      # Positive wheel-reference acceleration limit in rad/s².
      max_wheel_acceleration: 100.0
      # Wheel-reference deceleration magnitude in rad/s².
      max_wheel_deceleration: 100.0
      # true clamps reverse commands.
      prevent_reverse: true
      # Index of the speed/wheel-reference action, normally 1.
      speed_index: 1
  car_2:
    # Trainable: ppo/mappo. Fixed: ftg, pure_pursuit, stanley, hybrid_pp_ftg, racing_mpc or another registered MPC controller.
    algorithm: racing_mpc
    # true creates a learner; false creates a fixed controller.
    trainable: false
    # racer, attacker, defender or opponent; attacker/defender roles may resolve target_id automatically.
    role: opponent
    # Agent whose relative state/events this car tracks.
    target_id: car_0
    # Policy/controller parameters. Learner values here override training_defaults.
    params:
      # Fixed-controller target-speed cap in m/s, before the wheel adapter.
      max_speed: 3.5
      # Fixed-controller acceleration limit in m/s².
      max_acceleration: 5.0
      # MPC prediction horizon.
      horizon: 30
      # MPC control knots.
      knots: 6
      # MPC solver iteration budget.
      iterations: 18
      # MPC objective-evaluation budget.
      max_evaluations: 260
      # Obstacle/track safety margin in metres.
      margin: 0.1
      # Opponent sensing range in metres.
      sensing_range: 10.0
    # rolling_speed_to_wheel_v1 adapts fixed-controller m/s commands for the nonlinear wheel model.
    action_adapter: rolling_speed_to_wheel_v1
  car_3:
    # Trainable: ppo/mappo. Fixed: ftg, pure_pursuit, stanley, hybrid_pp_ftg, racing_mpc or another registered MPC controller.
    algorithm: racing_mpc
    # true creates a learner; false creates a fixed controller.
    trainable: false
    # racer, attacker, defender or opponent; attacker/defender roles may resolve target_id automatically.
    role: opponent
    # Agent whose relative state/events this car tracks.
    target_id: car_1
    # Policy/controller parameters. Learner values here override training_defaults.
    params:
      # Fixed-controller target-speed cap in m/s, before the wheel adapter.
      max_speed: 3.5
      # Fixed-controller acceleration limit in m/s².
      max_acceleration: 5.0
      # MPC prediction horizon.
      horizon: 30
      # MPC control knots.
      knots: 6
      # MPC solver iteration budget.
      iterations: 18
      # MPC objective-evaluation budget.
      max_evaluations: 260
      # Obstacle/track safety margin in metres.
      margin: 0.1
      # Opponent sensing range in metres.
      sensing_range: 10.0
    # rolling_speed_to_wheel_v1 adapts fixed-controller m/s commands for the nonlinear wheel model.
    action_adapter: rolling_speed_to_wheel_v1

# Local playback.
wandb:
  enabled: false

# Run with --eval --checkpoint outputs/YOUR_RUN --allow-provenance-mismatch.
