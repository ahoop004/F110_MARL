# Standalone workflow: legacy/ppo_racing.
# All active settings are inline. No scenario or config includes are required.
# Edit values below, or use: python3 run.py --scenario scenarios/legacy/ppo_racing.yaml --set key=value
# Parameter overrides accept YAML scalars/lists/mappings; quote values containing spaces.
# A mapping replaces that subtree; key=!delete removes an optional setting.
# Dedicated flags (--seed, --num-envs, --episodes, etc.) take precedence over --set.
# Agent params override training_defaults. Keep physics, actions and observation layout
# matched to the checkpoint. The commented recipes at the end list coordinated choices.

# Run identity, execution budget and CPU/GPU collection layout.
experiment:
  # Run/output name; use a distinct name for each parameter comparison.
  name: ppo_vs_pure_pursuit
  # Episode budget. A non-null total_steps takes precedence; --episodes removes total_steps.
  episodes: 5000
  # Reproducible seed. Keep final-test seeds disjoint from checkpoint-selection seeds.
  seed: 42

# Shared learner defaults. agents.<id>.params overrides these values.
training_defaults:
  # Options used here: episodes or environment_steps; match the chosen run budget.
  progress_unit: episodes
  # PPO: pooled rollout transitions. MAPPO: per-agent serial buffer size.
  n_steps: 2048
  # Optimizer passes over each collected rollout.
  n_epochs: 10
  # Generalized-advantage bias/variance tradeoff, normally between 0 and 1.
  gae_lambda: 0.95
  # PPO probability-ratio clipping threshold.
  clip_range: 0.2
  # Exploration entropy coefficient; 0 disables the bonus.
  ent_coef: 0.01
  # Critic-loss multiplier.
  vf_coef: 0.5
  # Gradient norm clipping threshold.
  max_grad_norm: 0.5
  # Learner samples per optimizer minibatch.
  batch_size: 64
  # Initial optimizer learning rate.
  learning_rate: 0.0003
  # Reward discount per policy decision; changing action_repeat changes its physical time horizon.
  gamma: 0.99

# Simulation, map selection, race lifecycle and sensing parameters.
environment:
  # Physics seconds per step; decision duration is timestep * action_repeat.
  timestep: 0.01
  # Number of LiDAR beams; affects policy input width when LiDAR is enabled.
  lidar_beams: 108
  # Maximum LiDAR range in metres.
  lidar_range: 10.0
  # true opens visualization; false is headless. --render/--no-render overrides this.
  render: false
  # Load centerline geometry from the selected map bundle.
  centerline_autoload: true
  # Load wall geometry from the selected map bundle.
  walls_autoload: true
  # Track lookahead geometry used by observations/controllers.
  track_preview:
    # Number of preview samples; changing this changes observation dimensions.
    points: 20
    # Distance in metres between track-preview samples.
    spacing: 0.3
  # Joint reset rule and whether a completed lap target ends a car's episode.
  episode_termination:
    # Options: any_agent, all_agents, all_trainable. Choose whether survivors keep driving.
    mode: any_agent
  # Behavior of cars after their terminal event; clearance affects collisions and sensing.
  terminal_agents:
    # Whether terminal cars remain physical obstacles before any configured removal.
    remain_collidable: true
    # Terminal crash behavior: stationary.
    crashed_behavior: stationary
    # Terminal finish behavior: coast_then_stop.
    finished_behavior: coast_then_stop
    # Physics steps allowed for finished-car clearance.
    finish_clearance_steps: 200
  # Legacy map list; prefer map_bundles for new experiments.
  maps:
    - line2
  # Lap finish target; ignored as a termination trigger when lap_completion is false.
  target_laps: 1
  # Physics-step horizon; 0 disables the timeout. Evaluation should use a finite horizon.
  max_steps: 3000
  # Physics steps per policy decision; use 1 with joint team-return contracts.
  action_repeat: 2
  # Enable centerline progress/state facts required by observations and rewards.
  centerline_features: true
  # Episode start randomization; fixed starts use enabled: false and explicit spawn settings.
  random_spawn:
    # true enables this component; false disables it.
    enabled: true
    # Whether multiple spawn selections may reuse available slots.
    allow_reuse: true
  # Physical model contract. Keep values matched for checkpoint transfer; synthetic values are uncalibrated.
  vehicle_params:
    v_switch: 0.8
    a_max: 2.0
    v_min: -1.0
    v_max: 3.0

# Per-car policy, inline observation/reward definitions and action processing.
agents:
  car_0:
    # Trainable: ppo/mappo. Fixed: ftg, pure_pursuit, stanley, hybrid_pp_ftg, racing_mpc or another registered MPC controller.
    algorithm: ppo
    # true creates a learner; false creates a fixed controller.
    trainable: true
    # racer, attacker, defender or opponent; attacker/defender roles may resolve target_id automatically.
    role: racer
    # Agent whose relative state/events this car tracks.
    target_id: car_1
    # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
    observation:
      # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
      observation:
        lidar:
          # true enables this component; false disables it.
          enabled: true
          # Normalize observation values using the configured scales.
          normalize: true
        ego_state:
          # true enables this component; false disables it.
          enabled: true
          include_velocity: true
          include_pose: false
        progress:
          # true enables this component; false disables it.
          enabled: true
        prev_action:
          # true enables this component; false disables it.
          enabled: true
    # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
    reward:
      # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
      reward:
        centerline_progress:
          # true enables this component; false disables it.
          enabled: true
          weight: 0.1
          normalize_by_track_length: true
          reference_length: 400.0
        centerline_lateral_velocity_penalty:
          # true enables this component; false disables it.
          enabled: true
          weight: 0.005
          normalize_by_track_length: true
          reference_length: 400.0
        centerline_deviation_penalty:
          # true enables this component; false disables it.
          enabled: true
          weight: 0.01
        steering_penalty:
          # true enables this component; false disables it.
          enabled: true
          weight: 0.03
        wrong_way_penalty:
          # true enables this component; false disables it.
          enabled: true
          penalty: -2.0
        reverse_progress_penalty:
          # true enables this component; false disables it.
          enabled: true
          weight: 5.0
        offtrack_penalty:
          # true enables this component; false disables it.
          enabled: true
          max_abs_d: 1.5
          penalty: -1.0
        # true enables lap finishing; false allows continuous driving.
        lap_completion:
          # true enables this component; false disables it.
          enabled: true
          bonus: 150.0
          require_clean: true
        target_finish:
          # true enables this component; false disables it.
          enabled: true
          penalty: -100.0
        collision:
          # true enables this component; false disables it.
          enabled: true
          penalty: -200.0
        timeout_penalty:
          # true enables this component; false disables it.
          enabled: true
          penalty: -50.0
        self_crash_penalty:
          # true enables this component; false disables it.
          enabled: true
          penalty: -100.0
      task:
        # Task identifier stored with the reward definition.
        name: race_1v1
        description: Clean 1v1 racing reward with progress, lap, and target-finish terms.
    # Policy/controller parameters. Learner values here override training_defaults.
    params:
      # Initial optimizer learning rate.
      learning_rate: 0.0001
      # Fallback hidden-layer widths shared by actor/critic unless pi_/vf_hidden_dims override them.
      hidden_dims:
        - 64
        - 64
      # Reward discount per policy decision; changing action_repeat changes its physical time horizon.
      gamma: 0.998
      # Generalized-advantage bias/variance tradeoff, normally between 0 and 1.
      gae_lambda: 0.95
      # Exploration entropy coefficient; 0 disables the bonus.
      ent_coef: 0.0
      # PPO: pooled rollout transitions. MAPPO: per-agent serial buffer size.
      n_steps: 2048
      # Learner samples per optimizer minibatch.
      batch_size: 256
    # Convert normalized learner actions into physical reference commands.
    action_constraints:
      # true clamps reverse commands.
      prevent_reverse: true
      # Index of the speed/wheel-reference action, normally 1.
      speed_index: 1
  car_1:
    # Trainable: ppo/mappo. Fixed: ftg, pure_pursuit, stanley, hybrid_pp_ftg, racing_mpc or another registered MPC controller.
    algorithm: pure_pursuit
    # true creates a learner; false creates a fixed controller.
    trainable: false
    # racer, attacker, defender or opponent; attacker/defender roles may resolve target_id automatically.
    role: opponent
    # Agent whose relative state/events this car tracks.
    target_id: car_0
    # Policy/controller parameters. Learner values here override training_defaults.
    params:
      lookahead: 1.5
      # Fixed-controller minimum target speed in m/s.
      min_speed: 0.5
      # Fixed-controller target-speed cap in m/s, before the wheel adapter.
      max_speed: 3.0
      max_steer: 0.42
      wheelbase: 0.3302
      curvature_slowdown_threshold: 0.3
      speed_horizon: 3.0

# Weights & Biases logging; --no-wandb disables it.
wandb:
  logging:
    groups:
      define_metrics: true
      train: true
      eval: true
      eval_agg: true
      trainer_hooks: true
    metrics:
      train/episode: true
      train/outcome: true
      train/success: true
      train/episode_success: true
      train/episode_reward: true
      train/episode_steps: true
      train/success_rate: true
      train/reward_mean: true
      curriculum/phase_idx: true
      curriculum/eval_success_streak: true
      curriculum/eval_window_success_rate: true
      curriculum/eval_window_count: true
      curriculum/eval_window_size: true
      curriculum/criteria_eval_success_rate: true
      curriculum/criteria_eval_required_runs: true
      eval/episode: true
      eval/episode_success: true
      eval/episode_success_rate: true
      eval/rolling_success_rate: true
      eval/run: true
      eval_agg/success_rate: true
  # true enables this component; false disables it.
  enabled: false
  # Logging project name.
  project: marl-f110
  # Logging account/team; null uses the client default.
  entity: ahoop004-old-dominion-university
  # Run/output name; use a distinct name for each parameter comparison.
  name: null
  # Group related runs for comparison.
  group: racing_baselines
  # Run category in W&B.
  job_type: ppo_vs_pure_pursuit
  # Searchable run labels.
  tags:
    - ppo
    - racing
    - pure_pursuit
    - head_to_head
  # Human-readable description of this experiment.
  notes: PPO 1v1 racing against fixed Pure Pursuit on line2
  # Options: online, offline or disabled.
  mode: online

# Physical model contract. Keep values matched for checkpoint transfer; synthetic values are uncalibrated.
vehicle_params:
  # Road friction coefficient.
  mu: 1.0489
  C_Sf: 4.718
  C_Sr: 5.4562
  # Centre-of-mass to front axle distance in metres.
  lf: 0.15875
  # Centre-of-mass to rear axle distance in metres.
  lr: 0.17145
  # Centre-of-mass height in metres.
  h: 0.074
  # Vehicle body length in metres.
  length: 0.32
  # Vehicle body width in metres.
  width: 0.225
  # Vehicle mass in kilograms.
  m: 3.74
  # Yaw inertia in kg m².
  I: 0.04712
  s_min: -0.46
  s_max: 0.46
  sv_min: -3.2
  sv_max: 3.2
  v_switch: 7.319
  a_max: 9.51
  v_min: -5.0
  v_max: 10.0

# agents.car_0.params.target_kl: null  # Positive threshold enables PPO early stopping.
# agents.car_0.params.min_rollout_steps: 1  # Minimum pooled samples before a PPO update.
# agents.car_0.params.log_std_init: 0.0  # Initial Gaussian log standard deviation.
# Optional controls (uncomment at the indicated section, or use --set):
# experiment.collector_scheduling: synchronous  # synchronous | ready; self-play retains its scheduler.
# experiment.checkpoint: null  # PPO scratch; set a file/run directory for transfer or evaluation.
# experiment.evaluation_only: false  # true requires --eval.

# Parameter choice: ppo_vs_stanley
