# --set 'experiment.name="ppo_vs_stanley"'
# --set 'agents.car_1.algorithm="stanley"'
# --set 'agents.car_1.params.lookahead=!delete'
# --set 'agents.car_1.params.wheelbase=!delete'
# --set agents.car_1.params.k=1.0
