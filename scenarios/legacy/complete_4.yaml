# Standalone workflow: legacy/complete_4.
# All active settings are inline. No scenario or config includes are required.
# Edit values below, or use: python3 run.py --scenario scenarios/legacy/complete_4.yaml --set key=value
# Parameter overrides accept YAML scalars/lists/mappings; quote values containing spaces.
# A mapping replaces that subtree; key=!delete removes an optional setting.
# Dedicated flags (--seed, --num-envs, --episodes, etc.) take precedence over --set.
# Agent params override training_defaults. Keep physics, actions and observation layout
# matched to the checkpoint. The commented recipes at the end list coordinated choices.

# Run identity, execution budget and CPU/GPU collection layout.
experiment:
  # Run/output name; use a distinct name for each parameter comparison.
  name: complete_4
  # Episode budget. A non-null total_steps takes precedence; --episodes removes total_steps.
  episodes: 5000
  # Reproducible seed. Keep final-test seeds disjoint from checkpoint-selection seeds.
  seed: 42

# Shared learner defaults. agents.<id>.params overrides these values.
training_defaults:
  # Provenance label for the collection/update protocol; change when the protocol changes.
  update_version: p7-packed-batch512-v1
  # Options used here: episodes or environment_steps; match the chosen run budget.
  progress_unit: episodes
  # PPO: pooled rollout transitions. MAPPO: per-agent serial buffer size.
  n_steps: 2048
  # Physics steps per policy decision; use 1 with joint team-return contracts.
  action_repeat: 1
  # Optimizer passes over each collected rollout.
  n_epochs: 10
  # Generalized-advantage bias/variance tradeoff, normally between 0 and 1.
  gae_lambda: 0.95
  # PPO probability-ratio clipping threshold.
  clip_range: 0.2
  # Exploration entropy coefficient; 0 disables the bonus.
  ent_coef: 0.01
  # Critic-loss multiplier.
  vf_coef: 0.5
  # Gradient norm clipping threshold.
  max_grad_norm: 0.5
  # Learner samples per optimizer minibatch.
  batch_size: 512
  # Initial optimizer learning rate.
  learning_rate: 0.0003
  # Reward discount per policy decision; changing action_repeat changes its physical time horizon.
  gamma: 0.99
  # Fallback hidden-layer widths shared by actor/critic unless pi_/vf_hidden_dims override them.
  hidden_dims:
    - 256
    - 256
  # Available network activations: tanh, relu, silu, swish, leaky_relu (see agents/common/networks.py).
  activation: tanh
  # Learner device: cpu, cuda, or an explicit device such as cuda:0.
  device: cuda

# Choose reward aggregation and critic conditioning together.
mappo:
  # Options: individual or team_shared.
  reward_mode: individual
  # Options: agent_conditioned for individual rewards, shared_team for team rewards.
  critic_mode: agent_conditioned
  # Options: mean or sum; this changes the reward scale.
  team_reward_reduction: mean

# Simulation, map selection, race lifecycle and sensing parameters.
environment:
  # Physics seconds per step; decision duration is timestep * action_repeat.
  timestep: 0.01
  # Number of LiDAR beams; affects policy input width when LiDAR is enabled.
  lidar_beams: 108
  # Maximum LiDAR range in metres.
  lidar_range: 10.0
  # true opens visualization; false is headless. --render/--no-render overrides this.
  render: false
  # Load centerline geometry from the selected map bundle.
  centerline_autoload: true
  # Load wall geometry from the selected map bundle.
  walls_autoload: true
  # Track lookahead geometry used by observations/controllers.
  track_preview:
    # Number of preview samples; changing this changes observation dimensions.
    points: 20
    # Distance in metres between track-preview samples.
    spacing: 0.3
  # Joint reset rule and whether a completed lap target ends a car's episode.
  episode_termination:
    # Options: any_agent, all_agents, all_trainable. Choose whether survivors keep driving.
    mode: all_agents
  # Behavior of cars after their terminal event; clearance affects collisions and sensing.
  terminal_agents:
    # Whether terminal cars remain physical obstacles before any configured removal.
    remain_collidable: true
    # Terminal crash behavior: stationary.
    crashed_behavior: stationary
    # Terminal finish behavior: coast_then_stop.
    finished_behavior: coast_then_stop
    # Physics steps allowed for finished-car clearance.
    finish_clearance_steps: 200
  # Available map bundles under maps/. Choose matching training/evaluation lists below.
  map_bundles:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  # Training maps. Keep intended held-out maps out of this list.
  map_bundles_train:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Spielberg_map
  # Evaluation maps; disjointness is a protocol choice, not automatic.
  map_bundles_eval:
    - Silverstone_map
    - Spa_map
  # Map switching schedule; per_episode changes the map when the environment resets.
  map_cycle: per_episode
  # Map selection: first, round_robin or random; epoch_shuffle reshuffles each completed cycle.
  map_pick: round_robin
  # Lap finish target; ignored as a termination trigger when lap_completion is false.
  target_laps: 1
  # Finish-line crossing rules; do not change when comparing lap metrics.
  lap_counting:
    # false requires a full lap after the initial finish-line crossing.
    count_initial_crossing_as_lap: false
  # Physics-step horizon; 0 disables the timeout. Evaluation should use a finite horizon.
  max_steps: 250000
  # Physics steps per policy decision; use 1 with joint team-return contracts.
  action_repeat: 2
  # Enable centerline progress/state facts required by observations and rewards.
  centerline_features: true
  # Episode start randomization; fixed starts use enabled: false and explicit spawn settings.
  random_spawn:
    # true enables this component; false disables it.
    enabled: true
    # Whether multiple spawn selections may reuse available slots.
    allow_reuse: true
  # Physical model contract. Keep values matched for checkpoint transfer; synthetic values are uncalibrated.
  vehicle_params:
    v_switch: 0.8
    a_max: 2.0
    v_min: -20.0
    v_max: 20.0

# Per-car policy, inline observation/reward definitions and action processing.
agents:
  car_0:
    # Trainable: ppo/mappo. Fixed: ftg, pure_pursuit, stanley, hybrid_pp_ftg, racing_mpc or another registered MPC controller.
    algorithm: mappo
    # true creates a learner; false creates a fixed controller.
    trainable: true
    # racer, attacker, defender or opponent; attacker/defender roles may resolve target_id automatically.
    role: racer
    # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
    observation:
      # Inline ObservationComposer configuration; ordering/dimensions are part of checkpoint compatibility.
      observation:
        lidar:
          # true enables this component; false disables it.
          enabled: true
          # Normalize observation values using the configured scales.
          normalize: true
        ego_state:
          # true enables this component; false disables it.
          enabled: true
          include_velocity: true
          include_pose: false
        progress:
          # true enables this component; false disables it.
          enabled: true
        prev_action:
          # true enables this component; false disables it.
          enabled: true
    # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
    reward:
      task:
        # Task identifier stored with the reward definition.
        name: complete_4_lap_completion
        description: Lap-normalized one-lap completion reward for four-car MAPPO.
      # Inline RewardComposer configuration; replace/disable components explicitly when changing objectives.
      reward:
        progress_delta_bonus:
          # true enables this component; false disables it.
          enabled: true
          weight: 100.0
          positive_only: false
          max_delta: 0.025
        # true enables lap finishing; false allows continuous driving.
        lap_completion:
          # true enables this component; false disables it.
          enabled: true
          bonus: 200.0
          require_clean: true
        collision:
          # true enables this component; false disables it.
          enabled: true
          penalty: -200.0
        timeout_penalty:
          # true enables this component; false disables it.
          enabled: true
          penalty: -50.0
        step_time_penalty:
          # true enables this component; false disables it.
          enabled: true
          penalty: -0.005
          apply_on_terminal: true
        reverse_velocity_penalty:
          # true enables this component; false disables it.
          enabled: true
          weight: 0.01
          deadband: 0.05
          max_reverse_speed: 2.0
        wrong_way_penalty:
          # true enables this component; false disables it.
          enabled: true
          penalty: -0.05
    # Policy/controller parameters. Learner values here override training_defaults.
    params:
      # Initial optimizer learning rate.
      learning_rate: 0.0003
      # Fallback hidden-layer widths shared by actor/critic unless pi_/vf_hidden_dims override them.
      hidden_dims:
        - 256
        - 256
      # Reward discount per policy decision; changing action_repeat changes its physical time horizon.
      gamma: 0.99
    # Convert normalized learner actions into physical reference commands.
    action_constraints:
      # true clamps reverse commands.
      prevent_reverse: true
      # Index of the speed/wheel-reference action, normally 1.
      speed_index: 1
