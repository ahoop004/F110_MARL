# Weights & Biases logging; --no-wandb disables it.
wandb:
  logging:
    groups:
      define_metrics: true
      train: true
      eval: true
      eval_agg: true
      trainer_hooks: true
    metrics:
      train/episode: true
      train/outcome: true
      train/success: true
      train/episode_success: true
      train/episode_reward: true
      train/episode_steps: true
      train/success_rate: true
      train/reward_mean: true
      curriculum/phase_idx: true
      curriculum/eval_success_streak: true
      curriculum/eval_window_success_rate: true
      curriculum/eval_window_count: true
      curriculum/eval_window_size: true
      curriculum/criteria_eval_success_rate: true
      curriculum/criteria_eval_required_runs: true
      eval/episode: true
      eval/episode_success: true
      eval/episode_success_rate: true
      eval/rolling_success_rate: true
      eval/run: true
      eval_agg/success_rate: true
  # true enables this component; false disables it.
  enabled: true
  # Logging project name.
  project: marl-f110-complete
  # Logging account/team; null uses the client default.
  entity: ahoop004-old-dominion-university
  # Run/output name; use a distinct name for each parameter comparison.
  name: null
  # Group related runs for comparison.
  group: complete4-full-circuit-v1
  # Run category in W&B.
  job_type: train-individual
  # Searchable run labels.
  tags:
    - mappo
    - racing
    - completion
    - 4car
    - full-circuit
    - individual-reward
    - agent-conditioned-critic
  # Human-readable description of this experiment.
  notes: One-full-circuit four-racer MAPPO with individual rewards and an agent-conditioned critic
  # Options: online, offline or disabled.
  mode: online

# Physical model contract. Keep values matched for checkpoint transfer; synthetic values are uncalibrated.
vehicle_params:
  # Road friction coefficient.
  mu: 1.0489
  C_Sf: 4.718
  C_Sr: 5.4562
  # Centre-of-mass to front axle distance in metres.
  lf: 0.15875
  # Centre-of-mass to rear axle distance in metres.
  lr: 0.17145
  # Centre-of-mass height in metres.
  h: 0.074
  # Vehicle body length in metres.
  length: 0.32
  # Vehicle body width in metres.
  width: 0.225
  # Vehicle mass in kilograms.
  m: 3.74
  # Yaw inertia in kg m².
  I: 0.04712
  s_min: -0.46
  s_max: 0.46
  sv_min: -3.2
  sv_max: 3.2
  v_switch: 7.319
  a_max: 9.51
  v_min: -5.0
  v_max: 10.0


# Optional controls (uncomment at the indicated section, or use --set):
# experiment.collector_scheduling: synchronous  # synchronous | ready; self-play retains its scheduler.
# experiment.checkpoint: null  # PPO scratch; set a file/run directory for transfer or evaluation.
# experiment.evaluation_only: false  # true requires --eval.
# training_defaults.lora: null  # Full actor training.
# training_defaults.lora: {mode: shared, rank: 4, alpha: 4.0, train_log_std: true}
# LoRA mode: shared | per_agent. Rank 4 or 8; alpha=rank gives unit residual scale.
# LoRA requires training_defaults.pretrained_actor_checkpoint or --pretrained-actor.
# LoRA and pretrained initialization are not supported by the two-team self-play path.
# recording:  # Top-level mapping; add enabled: true or pass --record-races.
#   enabled: false
#   sample_probability: 0.01
#   seed: 42
#   events: true
#   pre_steps: 60
#   post_steps: 100
#   max_clip_steps: 600
#   max_clips_per_episode: 16
#   max_events_per_clip: 128
#   max_frames: 100000
#   max_bytes: 2000000000
#   chunk_frames: 128
#   encounter_distance_m: 8.0
#   lateral_distance_m: 3.0
#   pass_hysteresis_m: 0.3
#   pass_sustain_steps: 3
#   windows: []

