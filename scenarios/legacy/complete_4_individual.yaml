# Four-car cooperative racing with individual factual rewards and V_i(s).
# This is the agent-conditioned comparison arm for complete_4_team_shared.yaml.
includes:
  - complete_4.yaml

experiment:
  name: complete_4_individual

mappo:
  reward_mode: individual
  critic_mode: agent_conditioned
  team_reward_reduction: mean

environment:
  map_bundles:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  map_bundles_train:
    - Budapest_map
    - circle_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Spielberg_map
  map_bundles_eval:
    - Silverstone_map
    - Spa_map

wandb:
  job_type: train-individual
  tags: [mappo, racing, completion, 4car, individual_reward, agent_conditioned_critic]
  notes: "One-full-circuit four-racer MAPPO with individual rewards and V_i(s)"
