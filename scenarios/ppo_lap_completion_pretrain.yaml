# Single-agent PPO testing/pretraining with planar MF6.1 and wheel actuators.
# Synthetic coefficients: this is not a calibrated reproduction of the paper.
# Train fresh: previous legacy/reduced-physics checkpoints are incompatible.
includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/combined_slip.yaml
  - ../configs/training/on_policy.yaml
  - ../configs/wandb.yaml

experiment:
  name: ppo_lap_completion_pretrain
  episodes: 10000
  seed: 42
  num_envs: 4
  torch_threads: 1

environment:
  map_bundles:
    #  - Budapest_map
    #  - circle_map
     - L_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_bundles_train:
    #  - Budapest_map
    #  - circle_map
     - L_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_bundles_eval:
    # - Budapest_map
    # - circle_map
    - L_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_cycle: per_episode
  map_pick: round_robin
  # Keep the existing lap-completion test task while the new map is prepared.
  timestep: 0.05
  target_laps: 3
  lap_counting:
    count_initial_crossing_as_lap: false
  max_steps: 16000
  action_repeat: 1
  centerline_autoload: true
  centerline_features: true
  # Render-only diagnostic: hue advances with normalized Frenet s and wraps
  # to red at the start/finish seam.
  centerline_render: true
  walls_autoload: true
  episode_termination:
    mode: any_agent
  random_spawn:
    enabled: true
    allow_reuse: true
  spawn:
    policy: centerline_relative
    centerline:
      mode: random
      min_progress: 0.0
      max_progress: 1.0
      avoid_finish: false
    offsets: {s_offset: 0.0, d_offset: 0.0}
    ego: {speed: 0.0}
  friction:
    version: 1
    scope: shared
    train: {mode: gaussian, relative_std: 0.02}
    eval: {mode: fixed, mu: 1.0489}

# Selection replays fixed seeds on the same track as training. Checkpoints are
# ranked by completion rate, lower collision rate, progress, then finish steps.
evaluation:
  enabled: true
  every_episodes: 500
  episodes: 8
  seed: 10042
  # Inherit environment.max_steps: 16000 decisions = 800 s at dt=0.05.
  # Run the independent final set explicitly after checkpoint selection.
  final_test:
    episodes: 20
    seed: 20042

agents:
  car_0:
    algorithm: ppo
    trainable: true
    role: racer
    observation: ../configs/observations/rl_racer_simulated_wheel.yaml
    reward: ../configs/reward/tasks/lap_completion_pretraining.yaml
    params:
      # arXiv:2504.02420v2, Sec. III-E. Decay is linear over completed
      # episodes here; the paper uses a fixed environment-step budget.
      learning_rate: 0.001
      lr_schedule: linear
      learning_rate_end: 0.0001
      batch_size: 1024
      pi_hidden_dims: [256, 256]
      vf_hidden_dims: [512, 512]
      activation: leaky_relu  # fixed negative slope 0.2
      # Paper decision interval and discount; rollout size is pooled across workers.
      n_steps: 4096  # 1024 decisions per worker with four workers
      gamma: 0.99
      checkpoint_every: 500
      device: cuda
    action_constraints:
      speed_control: wheel_acceleration
      max_wheel_acceleration: 100.0  # rad/s² = 5 m/s² at provisional R=0.05 m
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: null
  group: ppo-lap-completion-pretrain
  job_type: actor-pretraining
  tags: [ppo, single-agent, lap-completion, actor-pretraining, mf61-planar, uncalibrated]
  notes: "Planar MF6.1 physics test with synthetic coefficients, 50-value Frenet observation, wheel acceleration, Gaussian grip, and the existing lap-completion task"
  mode: online
