# Paper-inspired time-trial PPO with fixed track scales for actor transfer.
# F1TENTH Gym chassis/steering bounds with synthetic MF6.1 tire coefficients.
# This is not a calibrated reproduction of the paper.
# Train fresh: previous legacy/reduced-physics checkpoints are incompatible.
includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/combined_slip.yaml
  - ../configs/training/on_policy.yaml
  - ../configs/wandb.yaml

experiment:
  name: ppo_lap_completion_pretrain
  total_steps: 120000000  # aggregate policy decisions across all environments
  seed: 42
  num_envs: 1
  # num_envs: 400
  torch_threads: 1
  # Limit concurrent initialization; all 400 environments still collect together.
  worker_startup_batch_size: 16
  worker_startup_timeout_s: 600
  worker_response_timeout_s: 120

environment:
  map_bundles:
    #  - Budapest_map
    #  - circle_map
     - L_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_bundles_train:
    #  - Budapest_map
    #  - circle_map
     - L_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_bundles_eval:
    # - Budapest_map
    # - circle_map
    - L_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_cycle: per_episode
  map_pick: round_robin
  # Continuous time-trial training: only a boundary violation resets the car.
  timestep: 0.05
  target_laps: 20  # used for evaluation; training does not finish at this count
  lap_counting:
    count_initial_crossing_as_lap: false
  max_steps: 0  # no artificial training episode time limit
  action_repeat: 1
  centerline_autoload: true
  centerline_features: true
  # Render-only diagnostic: hue advances with normalized Frenet s and wraps
  # to red at the start/finish seam.
  centerline_render: true
  walls_autoload: true
  episode_termination:
    mode: any_agent
    lap_completion: false
  track_limits: {enabled: true, terminate: true}
  terminate_on_collision: false  # use geometric limits; wall contacts do not stop physics
  random_spawn:
    enabled: true
    allow_reuse: true
  spawn:
    policy: centerline_relative
    centerline:
      mode: random
      min_progress: 0.0
      max_progress: 1.0
      avoid_finish: false
    offsets: {s_offset: 0.0, d_offset: 0.0}
    ego: {speed: 0.0}
  friction:
    version: 1
    scope: shared
    train: {mode: gaussian, relative_std: 0.02}
    eval: {mode: fixed, mu: 1.0489}

# Evaluation follows full laps and records excursions without boundary resets.
# Checkpoint cadence/selection is an explicit implementation choice.
evaluation:
  enabled: true
  every_steps: 4096000  # ten complete 400 x 1024 collection rounds
  episodes: 8
  target_laps: 20
  max_steps: 16000  # finite evaluation limit, 800 seconds
  seed: 10042
  selection_strategy: lap_time
  final_test:
    episodes: 20
    seed: 20042

agents:
  car_0:
    algorithm: ppo
    trainable: true
    role: racer
    observation: ../configs/observations/rl_racer_simulated_wheel.yaml
    reward: ../configs/reward/tasks/lap_completion_pretraining.yaml
    params:
      # Sec. III-E endpoints; linear interpolation is an explicit assumption.
      # Schedule progress counts collected transitions, including boundary resets.
      learning_rate: 0.001
      lr_schedule: linear
      learning_rate_end: 0.0001
      batch_size: 1024
      pi_hidden_dims: [256, 256]
      vf_hidden_dims: [512, 512]
      activation: leaky_relu  # fixed negative slope 0.2
      # Paper decision interval and discount; rollout size is pooled across workers.
      n_steps: 409600  # pooled: 400 environments x 1024 decisions, across resets
      gamma: 0.99
      # Explicit implementation choices; not reported paper hyperparameters.
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01
      vf_coef: 0.5
      max_grad_norm: 0.5
      log_std_init: 0.0
      target_kl: null
      checkpoint_every_steps: 4096000
      device: cuda
    action_constraints:
      speed_control: wheel_acceleration
      max_wheel_acceleration: 100.0  # rad/s² = 5 m/s² at provisional R=0.05 m
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: null
  group: ppo-lap-completion-pretrain
  job_type: actor-pretraining
  tags: [ppo, single-agent, time-trial, actor-pretraining, mf61-planar, f1tenth-gym-reference, uncalibrated]
  notes: "F1TENTH Gym chassis/steering bounds with synthetic MF6.1 tires and provisional actuator response, 50-value Frenet observation, wheel acceleration, Gaussian grip, metre progress/boundary reward, continuous resets, and a 120M-transition budget"
  mode: online
