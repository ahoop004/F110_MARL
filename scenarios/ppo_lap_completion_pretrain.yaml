# Train a single local-observation PPO actor for later MAPPO initialization.
# Paper-inspired networks/optimization; a receiving MAPPO actor must use
# [256, 256] hidden layers and leaky_relu (slope 0.2) for these checkpoints.
# Best-model selection uses deterministic evaluation rather than training return.
includes:
  - ../configs/env/default.yaml
  - ../configs/training/on_policy.yaml
  - ../configs/wandb.yaml

experiment:
  name: ppo_lap_completion_pretrain
  episodes: 1000
  seed: 42
  num_envs: 4
  torch_threads: 1

environment:
  map_bundles:
    # - Budapest_map
    - circle_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_bundles_train:
    # - Budapest_map
    - circle_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_bundles_eval:
    # - Budapest_map
    - circle_map
    # - Melbourne_map
    # - Montreal_map
    # - Shanghai_map
    # - Silverstone_map
    # - Spa_map
    # - Spielberg_map
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 3
  lap_counting:
    count_initial_crossing_as_lap: false
  max_steps: 80000
  action_repeat: 1
  centerline_autoload: true
  centerline_features: true
  # Render-only diagnostic: hue advances with normalized Frenet s and wraps
  # to red at the start/finish seam.
  centerline_render: true
  walls_autoload: true
  episode_termination:
    mode: any_agent
  random_spawn:
    enabled: true
    allow_reuse: true
  vehicle_params:
    # Explicit snapshot of the existing runtime parameters. The former vehicle
    # include declared a top-level block that create_training_setup did not use.
    mu: 1.0489
    C_Sf: 4.718
    C_Sr: 5.4562
    lf: 0.15875
    lr: 0.17145
    h: 0.074
    m: 3.74
    I: 0.04712
    length: 0.32
    width: 0.225
    s_min: -0.4189
    s_max: 0.4189
    sv_min: -3.2
    sv_max: 3.2
    v_switch: 0.8
    a_max: 2.0
    v_min: -20.0
    v_max: 20.0

# Every evaluation replays the same seeds on held-out maps. Checkpoints are
# ranked by completion rate, lower collision rate, progress, then finish steps.
evaluation:
  enabled: true
  every_episodes: 100
  episodes: 8
  seed: 10042
  max_steps: 40000

agents:
  car_0:
    algorithm: ppo
    trainable: true
    role: racer
    observation: ../configs/observations/rl_racer.yaml
    reward: ../configs/reward/tasks/lap_completion_normalized_progress.yaml
    params:
      # arXiv:2504.02420v2, Sec. III-E. Decay is linear over completed
      # episodes here; the paper uses a fixed environment-step budget.
      learning_rate: 0.001
      lr_schedule: linear
      learning_rate_end: 0.0001
      batch_size: 1024
      pi_hidden_dims: [256, 256]
      vf_hidden_dims: [512, 512]
      activation: leaky_relu  # fixed negative slope 0.2
      # Match gamma=0.99 at 0.05 s with our 0.01 s decision interval:
      # gamma = 0.99 ** (0.01 / 0.05). Recompute if action_repeat/dt changes.
      gamma: 0.9979919516614258
      checkpoint_every: 500
      device: cuda
    action_constraints:
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: null
  group: ppo-lap-completion-pretrain
  job_type: actor-pretraining
  tags: [ppo, single-agent, lap-completion, actor-pretraining]
  notes: "Single-agent PPO actor pretraining with held-out completion-based checkpoint selection"
  mode: online
