# Existing combined-slip entry point; physics and observation live in the base scenario.
# Synthetic MF6.1 coefficients require fresh training and eventual calibration.
includes:
  - ppo_lap_completion_pretrain.yaml

experiment:
  name: ppo_lap_completion_pretrain_combined_slip
  checkpoint: null
  num_envs: 1

evaluation:
  every_episodes: 100
  selection_strategy: completion_progress

agents:
  car_0:
    params:
      learning_rate: 0.0005
      ent_coef: 0.001
      n_steps: 1024

wandb:
  group: ppo-lap-completion-pretrain-combined-slip
