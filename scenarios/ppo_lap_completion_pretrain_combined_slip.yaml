# Single-agent pretraining with the implemented nonlinear tires and wheel actuators.
# Synthetic, uncalibrated reduced physics: this is not an MF6.1 reproduction.
# Train fresh; legacy vehicle-speed checkpoints have incompatible contracts.
includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/combined_slip.yaml
  - ../configs/training/on_policy.yaml
  - ../configs/wandb.yaml

experiment:
  name: ppo_lap_completion_pretrain_combined_slip
  checkpoint: null
  episodes: 10000
  seed: 42
  num_envs: 1
  torch_threads: 1

environment:
  map_bundles: [circle_map]
  map_bundles_train: [circle_map]
  map_bundles_eval: [circle_map]
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 3
  lap_counting:
    count_initial_crossing_as_lap: false
  max_steps: 80000
  # Preserve the Frenet baseline's 0.01 s decision interval and reward timing.
  action_repeat: 1
  centerline_autoload: true
  centerline_features: true
  centerline_render: true
  walls_autoload: true
  random_spawn:
    enabled: true
    allow_reuse: true
  # No friction override: use the profile's fixed nominal mu for train and eval.
  # Add randomization as a separate experiment after establishing this baseline.

evaluation:
  enabled: true
  every_episodes: 500
  episodes: 8
  seed: 10042
  selection_strategy: completion_progress
  # Same track/horizon, independent final seeds; run --eval-protocol final explicitly.
  final_test:
    episodes: 20
    seed: 20042

agents:
  car_0:
    algorithm: ppo
    trainable: true
    role: racer
    # 158 values: LiDAR plus Frenet/track features and simulated wheel state.
    observation: ../configs/observations/rl_racer_simulated_wheel.yaml
    reward: ../configs/reward/tasks/lap_completion_frenet.yaml
    params:
      # Paper-inspired networks/LR; budget and LR decay remain episode-based.
      pi_hidden_dims: [256, 256]
      vf_hidden_dims: [512, 512]
      activation: leaky_relu
      learning_rate: 0.0005
      lr_schedule: linear
      learning_rate_end: 0.0001
      # Aggregate rollout: 256 decisions per worker with eight environments.
      n_steps: 2048
      batch_size: 1024
      # gamma = 0.99 ** (0.01 / 0.05); retain the Frenet ~2 s GAE trace.
      gamma: 0.9979919516614258
      gae_lambda: 0.997
      checkpoint_every: 500
      device: cuda
    action_constraints:
      speed_control: wheel_acceleration
      # Wheel-reference derivative in rad/s²; at radius 0.05 m, ±5 m/s².
      max_wheel_acceleration: 100.0
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1

wandb:
  enabled: true
  project: marl-f110-complete
  entity: ahoop004-old-dominion-university
  name: null
  group: ppo-lap-completion-pretrain-combined-slip
  job_type: actor-pretraining
  tags: [ppo, single-agent, lap-completion, actor-pretraining, combined-slip, simulated-wheel, uncalibrated]
  notes: "Fresh PPO with reduced combined-slip physics, wheel actuators, fixed nominal grip, and same-track evaluation; uncalibrated simulation baseline"
  mode: online
