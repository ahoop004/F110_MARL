# Three-lap Budapest transfer from the current L-map PPO pretraining run.
# Inherit the current chassis and fixed track-scaling observation contracts.
includes:
  - ppo_lap_completion_transfer.yaml

experiment:
  name: ppo_lap_completion_transfer_budapest_3lap
  checkpoint: ../outputs/L_map_pretrain/best_model.pt
  # Inherit the local worker count and 4,096,000-transition transfer budget.

environment:
  map_bundles:
     - Budapest_map
     - circle_map
    #  - L_map
     - Melbourne_map
     - Montreal_map
     - Shanghai_map
     - Silverstone_map
     - Spa_map
     - Spielberg_map
  map_bundles_train:
     - Budapest_map
     - circle_map
    #  - L_map
     - Melbourne_map
     - Montreal_map
     - Shanghai_map
     - Silverstone_map
     - Spa_map
     - Spielberg_map
  map_bundles_eval:
    - Budapest_map
    - circle_map
    # - L_map
    - Melbourne_map
    - Montreal_map
    - Shanghai_map
    - Silverstone_map
    - Spa_map
    - Spielberg_map
  target_laps: 3
  max_steps: 16000  # 800 simulation seconds; bounds stalled episodes
  episode_termination: {mode: any_agent, lap_completion: true}
  track_limits: {enabled: true, terminate: true}
  terminate_on_collision: false  # geometric boundary resets, matching pretraining

evaluation:
  target_laps: 3
  max_steps: 16000
  terminate_on_track_limit: true
  terminate_on_collision: true
  selection_strategy: completion_progress

wandb:
  group: ppo-lap-completion-transfer-3lap
  tags: [ppo, single-agent, three-lap, track-transfer, current-pretrain-physics]
  notes: "Three-lap Budapest transfer from the current L-map pretraining run; shared physics and fixed track scaling. Actor and critic loaded with a fresh optimizer."
