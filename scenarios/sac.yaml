includes:
- ../configs/env/line2_gaplock.yaml
- ../configs/reward/gaplock_centerline_pressure.yaml
- ../configs/agents/ftg_defender.yaml
- ../configs/agents/action_constraints.yaml
- ../configs/evaluation/line2_gaplock_eval_standard.yaml
- ../configs/wandb.yaml
experiment:
  name: sac
  episodes: 2000
  seed: 42
environment:
  max_steps: 1200
  action_repeat: 2
agents:
  car_0:
    role: attacker
    algorithm: sb3_sac
    target_id: car_1
    params:
      learning_rate: 0.0003
      gamma: 0.99
      tau: 0.005
      ent_coef: auto
      target_entropy: auto
      activation: relu
      hidden_dims:
      - 256
      - 256
      buffer_size: 1000000
      batch_size: 256
      learning_starts: 1000
      train_freq: 1
      gradient_steps: 1
    observation:
      preset: gaplock
wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: algo_comparison
  job_type: sac
  tags:
  - comparison
  - sac
  - gaplock
  notes: "SAC vs PPO comparison — same reward, env, budget (use run_sb3_offpolicy.py)"
  mode: online
