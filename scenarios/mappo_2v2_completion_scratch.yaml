# Shared task and scratch baseline; transfer variants include this file.
# Local: python3 run.py --scenario scenarios/mappo_2v2_completion_scratch.yaml --no-wandb
# HPC: append --num-envs 64 --num-workers 32 --set training_defaults.device=cuda --wandb
# Physics/action limits match outputs/pretrain/best_model.pt (8 m/s rolling-speed cap).
# --total-steps controls aggregate environment decisions; --seed selects a replicate.
# Local quick run: append --total-steps 2048 --set evaluation.enabled=false
# Parallel horizon is rollout_steps_per_env; serial buffer size is n_steps.
# Changing environment count/horizon changes the PPO batch size, so match these across arms.
# Training/evaluation use the same nine maps; final-test seeds are separate, not held-out maps.
# For three-lap evaluation: --set evaluation.target_laps=3
# Signed progress is per lap; collision cost replaces progress on terminal failure.
# Boundary violations replace progress with -0.05 per step; collisions terminate.
# Time cost is at most 0.2 over the 800 s timeout, below the 2.0 crash cost.
# Shared mean local rewards plus a once-only both-finish bonus use joint team returns.
# rank_bonus=0 disables competition rewards while reusing the existing team-result component.
experiment:
  name: mappo_2v2_completion_scratch
  episodes: 5000
  seed: 42
  num_envs: 1
  torch_threads: 1
  terminal_every_updates: 1
  collector_progress_interval_s: 15
  total_steps: 120000000
  collector_scheduling: synchronous
training_defaults:
  update_version: p7-packed-batch512-v1
  progress_unit: environment_steps
  n_steps: 2048
  action_repeat: 1
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  batch_size: 512
  learning_rate: 0.0003
  gamma: 0.99
  hidden_dims:
  - 256
  - 256
  activation: tanh
  team_return_mode: joint
  pretrained_actor_checkpoint: null
  require_pretrained_actor: false
  pretrained_actor_observation_extension: frenet_neighbors
  device: cpu
  checkpoint_every_steps: 4096000
  rollout_steps_per_env: 256
mappo:
  actor_mode: independent
  reward_mode: team_shared
  critic_mode: shared_team
  team_reward_reduction: mean
environment:
  max_speed: 8.0
  timestep: 0.05
  lidar_beams: 108
  lidar_range: 10.0
  render: false
  centerline_autoload: true
  walls_autoload: true
  track_preview:
    points: 20
    spacing: 0.3
  episode_termination:
    mode: all_trainable
    lap_completion: true
  terminal_agents:
