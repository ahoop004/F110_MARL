# Frenet pretraining with an integrated speed reference and stronger acceleration.
# Inherit maps, seeds, networks, and evaluation episodes from the baseline.
# The speed action now means acceleration; train a fresh checkpoint.
includes:
  - ppo_lap_completion_pretrain.yaml

experiment:
  name: ppo_lap_completion_pretrain_frenet
  # Preserve the single-environment collection used at 43ffaaf (clean up).
  # Four workers split n_steps=2048 into 512-step fragments per environment.
  num_envs: 1

environment:
  vehicle_params:
    # Allow up to 5 m/s² throughout the configured 0–20 m/s forward range.
    # The simulator's speed controller still determines actual acceleration.
    a_max: 5.0
    v_switch: 20.0
  track_preview:
    points: 20
    spacing: 0.3

evaluation:
  # At equal completion rates, favor earned progress over stationary survival.
  selection_strategy: completion_progress

agents:
  car_0:
    observation: ../configs/observations/rl_racer_vehicle_track_frenet_acceleration.yaml
    reward: ../configs/reward/tasks/lap_completion_frenet.yaml
    params:
      # At dt=0.01 and gamma=0.99799195, gamma*lambda decays over ~2 s.
      # Acceleration needs credit beyond the inherited ~0.19 s trace.
      gae_lambda: 0.997
    action_constraints:
      speed_control: acceleration
      max_acceleration: 5.0
      max_deceleration: 5.0
      prevent_reverse: true
      speed_index: 1

wandb:
  group: ppo-lap-completion-pretrain-frenet
  tags: [ppo, single-agent, lap-completion, actor-pretraining, lidar, frenet, track-preview, acceleration-control]
  notes: "Frenet acceleration control with denser progress/time shaping, ~2 s GAE trace, and completion-first earned-progress selection; same-track evaluation"
