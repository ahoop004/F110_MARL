# Existing Frenet entry point now shares the paper-style vehicle/observation interface.
# No separate legacy acceleration implementation is selected by this scenario.
includes:
  - ppo_lap_completion_pretrain.yaml

experiment:
  name: ppo_lap_completion_pretrain_frenet
  num_envs: 8

agents:
  car_0:
    params:
      n_steps: 8192  # 1024 decisions per worker

evaluation:
  selection_strategy: completion_progress

wandb:
  group: ppo-lap-completion-pretrain-frenet
