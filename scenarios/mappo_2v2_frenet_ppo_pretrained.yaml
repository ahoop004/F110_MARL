# PPO driving actor transfer to two MAPPO teammates under the same MF6.1 physics.
# Set training_defaults.pretrained_actor_checkpoint to a NEW PPO best_model.pt.
# null deliberately runs the matched from-scratch arm. Fifty driving inputs are
# preserved; 15 appended relative-neighbor inputs start with zero actor weights.
# Fixed opponents retain their controller settings, with an explicit wheel adapter.
includes:
- ../configs/env/default.yaml
- ../configs/vehicle/combined_slip.yaml
- ../configs/training/mappo.yaml
- ../configs/wandb.yaml
experiment:
  name: mappo_2v2_frenet_ppo_pretrained
  episodes: 5000
  seed: 42
  num_envs: 1
  torch_threads: 1
training_defaults:
  team_return_mode: joint
  pretrained_actor_checkpoint: null
  pretrained_actor_observation_extension: frenet_neighbors
  device: cuda
mappo:
  reward_mode: team_shared
  critic_mode: shared_team
  team_reward_reduction: mean
environment:
  timestep: 0.05
  lidar_beams: 108
  lidar_range: 10.0
  render: false
  centerline_autoload: true
  walls_autoload: true
  track_preview:
    points: 20
    spacing: 0.3
  episode_termination:
    mode: all_agents
  terminal_agents:
    remain_collidable: true
    crashed_behavior: stationary
    finished_behavior: coast_then_stop
    finish_clearance_steps: 40
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 3
  max_steps: 16000
  action_repeat: 1
  centerline_features: true
  random_spawn:
    enabled: true
    allow_reuse: true
  map_bundles:
  - Budapest_map
  - circle_map
  map_bundles_train:
  - Budapest_map
  - circle_map
  map_bundles_eval:
  - circle_map
  lap_counting:
    count_initial_crossing_as_lap: false
  friction:
    version: 1
    scope: shared
    train:
      mode: gaussian
      relative_std: 0.02
    eval:
      mode: fixed
      mu: 1.0489
  terminate_on_collision: true
evaluation:
  enabled: false
  episodes: 8
  seed: 10042
  max_steps: 16000
  final_test:
    episodes: 20
    seed: 20042
agents:
  car_0:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_2
    observation: ../configs/observations/rl_racer_simulated_wheel_neighbors.yaml
    reward: ../configs/reward/tasks/lap_completion_normalized_progress.yaml
    params: &learner_params
      learning_rate: 0.0001
      pi_hidden_dims:
      - 256
      - 256
      vf_hidden_dims:
      - 512
      - 512
      activation: leaky_relu
      gamma: 0.99
      checkpoint_every: 100
    action_constraints: &learner_actions
      speed_control: wheel_acceleration
      max_wheel_acceleration: 100.0
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1
  car_1:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_3
    observation: ../configs/observations/rl_racer_simulated_wheel_neighbors.yaml
    reward: ../configs/reward/tasks/lap_completion_normalized_progress.yaml
    params: *learner_params
    action_constraints: *learner_actions
  car_2:
    algorithm: hybrid_pp_ftg
    trainable: false
    role: opponent
    target_id: car_0
    params:
      lookahead: 2.0
      min_speed: 0.8
      max_speed: 2.5
      max_steer: 0.35
      wheelbase: 0.3302
      curvature_slowdown_threshold: 0.2
      speed_horizon: 3.0
      blend_distance: 2.0
      full_ftg_distance: 0.75
      ftg:
        max_distance: 10.0
        window_size: 6
        bubble_radius: 2.5
        max_steer: 0.3
        min_speed: 0.8
        max_speed: 2.5
        steering_gain: 0.2
        fov: 4.71238898
        normalized: false
        steer_smooth: 0.7
        mode: lidar
        gap_min_range: 0.5
        target_mode: center
        wall_avoid_kick: 0.01
        use_disparity_extender: true
        disparity_threshold: 0.35
        vehicle_width: 0.225
        safety_margin: 0.1
    action_adapter: rolling_speed_to_wheel_v1
  car_3:
    algorithm: hybrid_pp_ftg
    trainable: false
    role: opponent
    target_id: car_1
    params:
      lookahead: 2.0
      min_speed: 0.8
      max_speed: 2.5
      max_steer: 0.35
      wheelbase: 0.3302
      curvature_slowdown_threshold: 0.2
      speed_horizon: 3.0
      blend_distance: 2.0
      full_ftg_distance: 0.75
      ftg:
        max_distance: 10.0
        window_size: 6
        bubble_radius: 2.5
        max_steer: 0.3
        min_speed: 0.8
        max_speed: 2.5
        steering_gain: 0.2
        fov: 4.71238898
        normalized: false
        steer_smooth: 0.7
        mode: lidar
        gap_min_range: 0.5
        target_mode: center
        wall_avoid_kick: 0.01
        use_disparity_extender: true
        disparity_threshold: 0.35
        vehicle_width: 0.225
        safety_margin: 0.1
    action_adapter: rolling_speed_to_wheel_v1
wandb:
  enabled: false
  project: marl-f110-complete
  group: mappo-2v2-frenet-ppo-pretrained
  job_type: pretrained-mappo-team
  tags:
  - mappo
  - 2v2
  - ppo-pretrained
  - mf61-planar
  - wheel-acceleration
  - neighbors
  notes: Current MF6.1 driving actor plus three relative neighbor slots; new input
    weights start at zero. Critic and optimizer start fresh.
