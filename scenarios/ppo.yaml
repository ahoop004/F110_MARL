includes:
- ../configs/env/line2_gaplock.yaml
- ../configs/reward/gaplock_attacker.yaml
- ../configs/agents/ftg_defender.yaml
- ../configs/observation/gaplock_attacker.yaml
- ../configs/curriculum/gaplock_phased.yaml
- ../configs/wandb.yaml

experiment:
  name: ppo
  episodes: 2000
  seed: 42
  save_model_at_end: true
  # save_model_name: ppo_final

environment:
  max_steps: 1200
  action_repeat: 2

agents:
  car_0:
    role: attacker
    algorithm: sb3_ppo
    target_id: car_1
    params:
      # Warm-start / model loading toggle (policy weights only).
      warm_start_enabled: false
      warm_start_model_path: ""
      warm_start_reset_lr: true

      device: cuda
      learning_rate: 0.0003
      learning_rate_curriculum:
        enabled: false
        mode: success_adaptive
        start: 0.0003
        final: 0.00005
        window_episodes: 200
        update_every_episodes: 50
        sr_lower_bound: 0.90
        sr_upper_bound: 0.99
        increment_min: 0.000005
        increment_max: 0.00002
        regression_enabled: true
        regression_sr_trigger: 0.70
        regression_sr_floor: 0.40
        regression_increment_min: 0.000005
        regression_increment_max: 0.00002
        regression_patience_updates: 2
        regression_cooldown_updates: 1
      gamma: 0.99
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      clip_range_curriculum:
        enabled: false
        mode: success_adaptive
        start: 0.2
        final: 0.08
        window_episodes: 200
        update_every_episodes: 50
        sr_lower_bound: 0.90
        sr_upper_bound: 0.99
        increment_min: 0.005
        increment_max: 0.02
        regression_enabled: true
        regression_sr_trigger: 0.70
        regression_sr_floor: 0.40
        regression_increment_min: 0.005
        regression_increment_max: 0.02
        regression_patience_updates: 2
        regression_cooldown_updates: 1
      # clip_range_vf: 0.2
      # target_kl: 0.02
      max_grad_norm: 0.5
      vf_coef: 0.5
      normalize_advantage: true
      ent_coef: 0.01
      ent_coef_curriculum:
        enabled: false
        mode: success_adaptive
        start: 0.01
        final: 0.002
        window_episodes: 200
        update_every_episodes: 50
        sr_lower_bound: 0.90
        sr_upper_bound: 0.99
        increment_min: 0.0002
        increment_max: 0.001
        regression_enabled: true
        regression_sr_trigger: 0.70
        regression_sr_floor: 0.40
        regression_increment_min: 0.0002
        regression_increment_max: 0.001
        regression_patience_updates: 2
        regression_cooldown_updates: 1
      activation: relu
      hidden_dims:
      - 256
      - 256
      batch_size: 64

wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: ppo-b
  group: null
  job_type: null
  tags:
  - improved
  - curriculum_v2
  - ppo
  - comparison
  - gaplock
  notes: "PPO curriculum for gaplock adversarial task (use run_sb3.py)"
  mode: online
