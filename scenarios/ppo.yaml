experiment:
  name: ppo
  episodes: 10000
  seed: 42
environment:
  max_steps: 2700
  action_repeat: 3
  spawn_y_curriculum:
    enabled: true
    mode: success_adaptive
    # y sampled each episode from [current_lower, y_upper]
    y_upper: 0.07689
    y_lower_start: 0.0768
    y_lower_bound: -1.0
    # update lower bound every N episodes using rolling success
    window_episodes: 100
    update_every_episodes: 100
    # map SR in [sr_lower_bound, sr_upper_bound] -> increment in [increment_min, increment_max]
    sr_lower_bound: 0.85
    sr_upper_bound: 0.95
    increment_min: -0.001
    increment_max: -0.01
evaluation:
  enabled: false
  frequency: 0
  gate_eval_schedule: false
  gate_phase_advancement: false
agents:
  car_0:
    role: attacker
    algorithm: sb3_ppo
    target_id: car_1
    params:
      learning_rate: 0.0003
      # learning_rate_schedule:
      #   type: linear
      #   final: 1.0e-05
      #   gate:
      #     success_rate: 0.85
      #     window_episodes: 100
      gamma: 0.99
      n_steps: 2048
      n_epochs: 10
      gae_lambda: 0.95
      clip_range: 0.2
      # clip_range_schedule:
      #   type: linear
      #   final: 0.05
      #   gate:
      #     success_rate: 0.85
      #     window_episodes: 100
      # clip_range_vf: 0.2
      # target_kl: 0.02
      max_grad_norm: 0.5
      vf_coef: 0.5
      normalize_advantage: true
      ent_coef: 0.0
      activation: relu
      hidden_dims:
      - 256
      - 256
      batch_size: 64
    observation:
      preset: gaplock
wandb:
  enabled: true
  project: marl-f110
  entity: ahoop004-old-dominion-university
  name: null
  group: null
  job_type: null
  tags:
  - improved
  - curriculum_v2
  - ppo
  - comparison
  - gaplock
  notes: "PPO curriculum for gaplock adversarial task (use run_sb3.py)"
  mode: online
