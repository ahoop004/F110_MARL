includes:
  - ../configs/env/default.yaml
  - ../configs/vehicle/default.yaml

experiment:
  name: nrl_1car
  episodes: 45   # probe.py distributes across maps (5 per map × 9 maps)
  seed: 42

environment:
  maps: auto           # auto-discovers all maps with centerline + walls CSVs
  map_cycle: per_episode
  map_pick: round_robin
  max_steps: 3000
  action_repeat: 2
  centerline_autoload: true
  walls_autoload: true
  random_spawn:
    enabled: true
    allow_reuse: true

agents:
  car_0:
    algorithm: hybrid_pp_ftg
    params:
      lookahead: 1.5
      min_speed: 0.5
      max_speed: 3.0
      max_steer: 0.42
      wheelbase: 0.33020
      curvature_slowdown_threshold: 0.3
      speed_horizon: 3.0
      blend_distance: 3.0
      full_ftg_distance: 1.5
      ftg:
        max_distance: 10.0
        bubble_radius: 2.5
        steering_gain: 0.30
        steer_smooth: 0.5
        use_disparity_extender: true
        disparity_threshold: 0.35
        vehicle_width: 0.225
        safety_margin: 0.10


wandb:
  enabled: false
