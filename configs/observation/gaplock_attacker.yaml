agents:
  car_0:
    # Action constraints for the trainable attacker.
    action_constraints:
      max_v: null
      prevent_reverse: false
      speed_index: 1

    # Observation configuration for the trainable attacker.
    observation:
      preset: gaplock
      overrides:
        # LiDAR features. Beam count is set by environment.lidar_beams in the env config.
        lidar:
          enabled: true
          max_range: 8.0
          normalize: true

        # Ego features.
        ego_state:
          pose: false
          velocity: true

        # Target features (adversarial setup).
        target_state:
          enabled: true
          pose: false
          velocity: true

        # Relative target pose features.
        relative_pose:
          enabled: true
          dim: 5

        # Optional features used by some presets/flatteners.
        speed:
          enabled: false
        prev_action:
          enabled: false
          dim: 2
        # Append previous normalized actions to each flattened observation.
        # When enabled, adds `size * action_dim` features.
        action_stack:
          enabled: true
          size: 3

        # Observation normalization metadata.
        normalization:
          enabled: true
          trainable_only: true

    frame_stack: 1
