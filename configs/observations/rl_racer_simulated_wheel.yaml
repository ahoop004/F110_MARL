# Shared PPO/MAPPO layout: LiDAR, then actual simulated wheel/track state.
# With 108 beams and N=20: 108 + 10 + 2*N = 158 values.
# N=20 and normalization maxima are provisional until identified data is available.
includes:
  - rl_racer_vehicle_track_frenet_acceleration.yaml

observation:
  lidar:
    enabled: true
    normalize: true
  frenet_vehicle_track:
    clip: false
    wheel_speed_source: simulated_v1
    wheel_radius: 0.05
    # Fixed SI scales shared by every map. Values may exceed one; do not clip.
    # This transfer-oriented choice differs from per-track normalization.
    track_maxima: {curvature: 1.0, width: 1.0}
    maxima:
      # Fixed observation scales; physical steering bounds come from the vehicle.
      delta: 0.5
      delta_ref: 0.5
