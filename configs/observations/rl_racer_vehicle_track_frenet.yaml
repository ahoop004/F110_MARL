# LiDAR plus the normalized vehicle/Frenet/track observation described in Eq. (2).
# Replace the provisional maxima below with maxima measured from the system-
# identification dataset before running the final experiment.
observation:
  lidar:
    enabled: true
    normalize: true
  frenet_vehicle_track:
    enabled: true
    points: 20
    wheel_radius: 0.05
    clip: false
    maxima:
      vx: 10.0
      vy: 10.0
      u: 3.141592653589793
      n: 5.0
      r: 10.0
      delta: 0.46
      delta_ref: 0.46
      omega_ref_dot: 20000.0
      omega_ref: 200.0
      omega: 200.0
