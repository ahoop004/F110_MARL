# MAPPO training defaults
# Merged with scenario params (scenario wins on conflict).
mappo:
  # Individual rewards require V_i(s). Cooperative experiments may instead
  # choose team_shared + shared_team explicitly in their scenario.
  reward_mode: individual
  critic_mode: agent_conditioned
  team_reward_reduction: mean

training_defaults:
  # Incremented because the P7 batch-size selection changes minibatch
  # composition and therefore requires new learning curves. This field is
  # retained in resolved-config provenance and ignored by the agent itself.
  update_version: p7-packed-batch512-v1
  progress_unit: episodes

  # Rollout collection
  n_steps: 2048          # steps per agent before update
  action_repeat: 1

  # PPO hyperparameters
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  batch_size: 512
  learning_rate: 3.0e-4
  gamma: 0.99

  # Network architecture
  hidden_dims: [256, 256]
  activation: tanh
