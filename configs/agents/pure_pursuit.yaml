agents:
  car_3:
    role: attacker
    algorithm: pure_pursuit
    params:
      lookahead: 1.5              # arc-length lookahead (m); larger = smoother but less precise
      min_speed: 0.5              # floor speed in corners (m/s)
      max_speed: 3.0              # straight-line speed (m/s)
      max_steer: 0.42             # matches vehicle_params.s_max
      wheelbase: 0.33020          # lf + lr (m)
      curvature_slowdown_threshold: 0.3  # rad/m at which speed starts dropping
      speed_horizon: 3.0          # arc-length (m) ahead to estimate curvature
