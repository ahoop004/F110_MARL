agents:
  car_3:
    role: attacker
    algorithm: stanley
    params:
      k: 1.0                      # cross-track gain; higher = more aggressive correction
      k_s: 0.5                    # softening constant (prevents div-by-zero at zero speed)
      min_speed: 0.5
      max_speed: 3.0
      max_steer: 0.42
      curvature_slowdown_threshold: 0.3
      speed_horizon: 3.0
