# Do not use target_crash_bonus here: it rewards target crashes, not clean
# racing finishes.

reward:
  centerline_progress:
    enabled: true
    weight: 0.1
    normalize_by_track_length: true
    reference_length: 400.0

  centerline_lateral_velocity_penalty:
    enabled: true
    weight: 0.005
    normalize_by_track_length: true
    reference_length: 400.0

  centerline_deviation_penalty: {enabled: true, weight: 0.01}

  steering_penalty: {enabled: true, weight: 0.03}

  wrong_way_penalty: {enabled: true, penalty: -2.0}

  reverse_progress_penalty: {enabled: true, weight: 5.0}

  offtrack_penalty: {enabled: true, max_abs_d: 1.5, penalty: -1.0}

  lap_completion: {enabled: true, bonus: 150.0, require_clean: true}

  target_finish: {enabled: true, penalty: -100.0}

  collision: {enabled: true, penalty: -200.0}

  timeout_penalty: {enabled: true, penalty: -50.0}

  self_crash_penalty: {enabled: true, penalty: -100.0}
