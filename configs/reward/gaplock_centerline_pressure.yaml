agents:
  car_0:
    reward:
      type: gaplock_centerline_pressure
      preset: gaplock_centerline_pressure
      overrides:
        # Terminal rewards/penalties.
        terminal:
          target_crash: 200.0
          self_crash: -100.0
          collision: -100.0
          timeout: -50.0
          target_finish: -50.0

        # Centerline deviation shaping.
        # Reward = weight * clip(|lateral_error| / scale, 0, 1)
        centerline_deviation:
          weight: 1.0
          scale: 1.0

        # Wall closeness shaping.
        # Reward = weight * clip(1 - min_wall_dist / distance_scale, 0, 1)
        wall_closeness:
          weight: 1.0
          distance_scale: 1.0
