task:
  name: lap_completion_pretraining
  description: Single-agent one-lap completion reward for MAPPO actor pretraining.

reward:
  # Normalize progress by one circuit so maps of different lengths contribute
  # comparable return scales.
  progress_delta_bonus:
    enabled: true
    weight: 100.0
    positive_only: false
    max_delta: 0.025

  lap_completion: {enabled: true, bonus: 200.0, require_clean: true}

  collision: {enabled: true, penalty: -200.0}

  timeout_penalty: {enabled: true, penalty: -200.0}

  step_time_penalty: {enabled: true, penalty: -0.025, apply_on_terminal: true}

  # Penalize actual negative body-frame longitudinal velocity. Ignore small
  # simulator jitter and cap the per-step magnitude after the deadband.
  reverse_velocity_penalty:
    enabled: true
    weight: 0.01
    deadband: 0.05
    max_reverse_speed: 2.0

  wrong_way_penalty: {enabled: true, penalty: -0.05}
