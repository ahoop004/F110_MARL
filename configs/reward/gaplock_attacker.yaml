agents:
  car_0:
    reward:
      preset: gaplock_full
      overrides:
        # ── Terminal rewards (fire once at episode end) ──────────────────────
        terminal:
          target_crash: 200.0    # attacker caused target to crash (success)
          self_crash: -100.0     # attacker crashed alone
          collision: -100.0      # mutual crash
          timeout: -50.0         # max steps reached
          idle_stop: -50.0        # attacker was idle-stopped by env
          target_finish: -50.0   # target crossed finish line

        # ── Per-step cost ────────────────────────────────────────────────────
        step_reward: 0.0

        # ── Pressure: reward for sustained close pursuit ─────────────────────
        pressure:
          enabled: true
          distance_threshold: 1.30
          min_speed: 0.30
          heading_tolerance: 1.57
          bonus: 0.12
          bonus_interval: 5
          streak_bonus: 0.10
          streak_cap: 40

        # ── Centerline deviation: reward target being off the racing line ─────
        # Dominant per-step signal. Requires centerline_autoload: true in env config.
        centerline_deviation:
          enabled: false
          weight: 0.05
          scale: 1.5

        # ── Wall closeness: reward target being near walls ────────────────────
        # Requires walls_autoload: true in env config.
        wall_closeness:
          enabled: false
          weight: 1.0
          distance_scale: 2.0

        # ── Forcing: geometric shaping toward attack positions ───────────────
        forcing:
          enabled: false
          pinch_pockets:
            enabled: false
            anchor_forward: 1.20
            anchor_lateral: 0.35
            sigma: 0.55
            weight: 0.004
            peak: 1.0
            floor: -0.5
            power: 2.0
          clearance:
            enabled: false
            weight: 0.003
            band_min: 0.30
            band_max: 3.20
            clip: 0.015
            time_scaled: true
          turn:
            enabled: false
            weight: 0.006
            clip: 0.015
            time_scaled: true

        # ── Distance: reward/penalty based on attacker-target range ──────────
        distance:
          enabled: true
          near_distance: 1.00
          far_distance: 2.50
          reward_near: 0.12
          penalty_far: 0.08

        # ── Heading: reward for pointing toward target ───────────────────────
        heading:
          enabled: true
          coefficient: 0.08

        # ── Speed: reward for maintaining speed near target ──────────────────
        speed:
          enabled: true
          bonus_coef: 0.0005
          target_speed: 0.60

        # ── Penalties: discourage idle, reverse, and hard braking ────────────
        penalties:
          enabled: true
          idle:
            penalty: 0.05
            speed_threshold: 0.12
            patience_steps: 25
          reverse:
            penalty: 0.10
            speed_threshold: 0.02
          brake:
            penalty: 0.05
            speed_threshold: 0.40
            drop_threshold: 0.25
