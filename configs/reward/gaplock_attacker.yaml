agents:
  car_0:
    reward:
      preset: gaplock_full
      overrides:
        forcing:
          enabled: false
          pinch_pockets:
            enabled: true
            anchor_forward: 1.2
            anchor_lateral: 0.35
            sigma: 0.55
            weight: 0.004
            peak: 1.0
            floor: -0.5
            power: 2.0
          clearance:
            enabled: true
            weight: 0.003
            band_min: 0.3
            band_max: 3.2
            clip: 0.015
            time_scaled: true
          turn:
            enabled: true
            weight: 0.006
            clip: 0.015
            time_scaled: true
        distance:
          enabled: false
          near_distance: 1.0
          far_distance: 2.5
          reward_near: 0.004
          penalty_far: 0.002
        heading:
          enabled: false
          coefficient: 0.001
        speed:
          enabled: false
          bonus_coef: 0.0005
        step_reward: -0.001
        # Centerline deviation: reward for pushing target off the racing line.
        # Requires centerline to be loaded (centerline_autoload: true in env config).
        centerline_deviation:
          enabled: true
          weight: 0.5
          scale: 1.0
        # Wall closeness: reward for forcing target near walls.
        # Requires walls to be loaded (walls_autoload: true in env config).
        wall_closeness:
          enabled: true
          weight: 0.5
          distance_scale: 1.0
        terminal:
          target_crash: 200.0
          self_crash: -20.0
          timeout: -100.0
          collision: -10.0
