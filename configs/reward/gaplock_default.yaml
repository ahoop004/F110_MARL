# Default gaplock reward for the adversarial attacker.
# Based on gaplock_simple (terminal + pressure + distance + heading + speed + penalties,
# forcing disabled) with slightly higher distance shaping weights.
agents:
  car_0:
    reward:
      type: gaplock
      preset: gaplock_simple
      overrides:
        distance:
          reward_near: 0.12
          penalty_far: 0.08
