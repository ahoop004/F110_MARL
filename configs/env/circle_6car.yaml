environment:
  map: circle_map/circle_map.yaml
  map_dir: maps
  num_agents: 6
  max_steps: 6000          # 60s at 0.01 timestep; covers ~half lap at 3 m/s avg
  lidar_beams: 54
  lidar_range: 10.0
  timestep: 0.01
  render: false

  centerline_autoload: true
  centerline_features: true
  centerline_render: false
  walls_autoload: true

  # 2x3 starting grid near the start/finish line.
  # 3 rows x 2 columns; rows spaced 1.6m apart (backward along track),
  # columns ±0.35m lateral from centreline.  All cars face start heading.
  # car_0..2 = defenders (front 4), car_3..5 = attackers (back 2 + front mixed).
  # Layout (facing direction of travel):
  #   col R   col L
  #   car_0   car_1   (row 0 — start line)
  #   car_2   car_3   (row 1 — 1.6 m back)
  #   car_4   car_5   (row 2 — 3.2 m back)
  start_poses:
    - [60.509, 119.038, -2.878]   # car_0  row0 col-R
    - [60.691, 118.362, -2.878]   # car_1  row0 col-L
    - [62.053, 119.455, -2.878]   # car_2  row1 col-R
    - [62.236, 118.780, -2.878]   # car_3  row1 col-L
    - [63.598, 119.873, -2.878]   # car_4  row2 col-R
    - [63.780, 119.197, -2.878]   # car_5  row2 col-L

  # Racing vehicle params — faster than gaplock defaults.
  vehicle_params:
    mu: 1.0489
    C_Sf: 4.718
    C_Sr: 5.4562
    lf: 0.15875
    lr: 0.17145
    h: 0.074
    length: 0.32
    width: 0.225
    m: 3.74
    I: 0.04712
    s_min: -0.46
    s_max: 0.46
    sv_min: -3.2
    sv_max: 3.2
    v_switch: 2.5
    a_max: 3.0
    v_min: -1.0
    v_max: 4.0
