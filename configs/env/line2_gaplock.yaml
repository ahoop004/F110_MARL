environment:
  map: maps/line2/line2.yaml
  num_agents: 2
  max_steps: 2500
  lidar_beams: 375   # 270° FOV / 0.72° per beam (YDLIDAR X2L @ 6Hz default: 6×360/3000)
  lidar_range: 8.0   # sensor max range (metres)
  spawn_points:
  - spawn_2
  - spawn_1
  timestep: 0.01
  render: false
  centerline_autoload: true   # required by centerline_deviation reward
  walls_autoload: true        # required by wall_closeness reward
  
  vehicle_params:
    mu: 1.0489
    C_Sf: 4.718
    C_Sr: 5.4562
    lf: 0.15875
    lr: 0.17145
    h: 0.074
    length: 0.32
    width: 0.225
    m: 3.74
    I: 0.04712
    s_min: -0.69   # arctan(L / 0.4m) = 0.69 rad → 0.4m min turning radius
    s_max: 0.69
    sv_min: -3.2
    sv_max: 3.2
    v_switch: 0.8
    a_max: 2.0
    v_min: -1.0
    v_max: 1.0
