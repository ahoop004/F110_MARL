# PPO driving actor transfer to two MAPPO teammates under the same MF6.1 physics.
# Set training_defaults.pretrained_actor_checkpoint to a NEW PPO best_model.pt.
# null deliberately runs the matched from-scratch arm. The 158-input LiDAR/driving
# layout matches PPO pretraining exactly; no observation extension is needed.
# Both fixed opponents use the validated racing MPC with an explicit wheel adapter.
# MPC reads perfect current traffic state within 10 m; this is privileged sensing.
includes:
- ../env/default.yaml
- ../vehicle/combined_slip.yaml
- ../training/mappo.yaml
- ../wandb.yaml
experiment:
  name: mappo_2v2_completion
  episodes: 5000
  seed: 42
  num_envs: 1
  torch_threads: 1
training_defaults:
  team_return_mode: joint
  pretrained_actor_checkpoint: null
  pretrained_actor_observation_extension: null
  device: cuda
mappo:
  reward_mode: team_shared
  critic_mode: shared_team
  team_reward_reduction: mean
environment:
  agent_teams: {car_0: learners, car_1: learners, car_2: opponents, car_3: opponents}
  timestep: 0.05
  lidar_beams: 108
  lidar_range: 10.0
  render: false
  centerline_autoload: true
  walls_autoload: true
  track_preview:
    points: 20
    spacing: 0.3
  episode_termination:
    mode: all_agents
  terminal_agents:
    remain_collidable: true
    crashed_behavior: stationary
    finished_behavior: coast_then_stop
    finish_clearance_steps: 40
  map_cycle: per_episode
  map_pick: round_robin
  target_laps: 3
  max_steps: 16000
  action_repeat: 1
  centerline_features: true
  random_spawn:
    enabled: true
    allow_reuse: true
  map_bundles:
  # - Budapest_map
  - circle_map
  map_bundles_train:
  # - Budapest_map
  - circle_map
  map_bundles_eval:
  - circle_map
  # - Budapest_map
  lap_counting:
    count_initial_crossing_as_lap: false
  friction:
    version: 1
    scope: shared
    train:
      mode: gaussian
      relative_std: 0.02
    eval:
      mode: fixed
      mu: 1.0489
  terminate_on_collision: true
evaluation:
  enabled: true
  every_episodes: 100
  selection_strategy: team_completion
  episodes: 8
  seed: 10042
  max_steps: 16000
  final_test:
    episodes: 20
    seed: 20042
agents:
  car_0:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_2
    observation: ../configs/observations/rl_racer_simulated_wheel.yaml
    reward: ../configs/reward/tasks/race_team_completion.yaml
    params: &learner_params
      learning_rate: 0.0001
      pi_hidden_dims:
      - 256
      - 256
      vf_hidden_dims:
      - 512
      - 512
      activation: leaky_relu
      gamma: 0.99
      checkpoint_every: 100
    action_constraints: &learner_actions
      speed_control: wheel_acceleration
      max_wheel_acceleration: 100.0
      max_wheel_deceleration: 100.0
      prevent_reverse: true
      speed_index: 1
  car_1:
    algorithm: mappo
    trainable: true
    role: racer
    target_id: car_3
    observation: ../configs/observations/rl_racer_simulated_wheel.yaml
    reward: ../configs/reward/tasks/race_team_completion.yaml
    params: *learner_params
    action_constraints: *learner_actions
  car_2:
    algorithm: racing_mpc
    trainable: false
    role: opponent
    target_id: car_0
    # Match configs/controllers/racing_mpc.yaml (validated bounded solver).
    params: &opponent_params
      max_speed: 3.5
      max_acceleration: 5.0
      horizon: 30
      knots: 6
      iterations: 18
      max_evaluations: 260
      margin: 0.1
      sensing_range: 10.0
    action_adapter: rolling_speed_to_wheel_v1
  car_3:
    algorithm: racing_mpc
    trainable: false
    role: opponent
    target_id: car_1
    params: *opponent_params
    action_adapter: rolling_speed_to_wheel_v1
wandb:
  enabled: true
  project: marl-f110-complete
  group: mappo-2v2-completion
  job_type: mappo-team
  tags:
  - mappo
  - 2v2
  - scratch-or-ppo-initialized
  - mf61-planar
  - wheel-acceleration
  - lidar
  - racing-mpc-opponents
  notes: Shared PPO/MAPPO 158-input LiDAR and MF6.1 driving observation; the full
    actor transfers directly. Critic and optimizer start fresh. Both opponents use
    racing_mpc with a 3.5 m/s rolling-speed cap and range-limited perfect traffic state.
